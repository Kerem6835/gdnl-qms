<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GDNL EOS | Departman Merkezi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#071b34;
  --text:#0f1b2f;
  --muted:#617086;
  --line:#dfe9f5;
  --green:#22b14c;
  --green2:#63dc73;
  --red:#b91c1c;
  --blue:#3b82f6;
  --soft:#f7fbff;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif}
html{
  width:100%;
  min-height:100%;
  overflow-x:hidden;
}
body{
  width:100%;
  min-height:100vh;
  min-height:100svh;
  min-height:100dvh;
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
  overflow-x:hidden;
  overflow-y:auto;
  background:
    radial-gradient(circle at 85% 9%,rgba(34,177,76,.13),transparent 27%),
    radial-gradient(circle at 12% 17%,rgba(59,130,246,.12),transparent 26%),
    linear-gradient(135deg,#fbfdff 0%,#edf5ff 45%,#f9fcff 100%);
}
body:before{
  content:"";
  position:fixed;
  inset:0;
  background:
    linear-gradient(90deg,rgba(255,255,255,.90),rgba(255,255,255,.42) 48%,rgba(255,255,255,.86)),
    radial-gradient(circle at 50% 100%,rgba(34,177,76,.06),transparent 36%);
  pointer-events:none;
}
.page{
  position:relative;
  z-index:1;
  width:100%;
  min-height:100vh;
  min-height:100svh;
  min-height:100dvh;
  padding:clamp(14px,2.2vh,26px) clamp(18px,2.2vw,32px) clamp(16px,2.3vh,28px);
  display:flex;
  flex-direction:column;
  gap:clamp(12px,1.8vh,18px);
  overflow-x:clip;
}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:clamp(12px,1.6vw,18px);
  min-height:clamp(64px,8.6vh,80px);
  min-width:0;
}
.brand{display:flex;align-items:center;gap:clamp(10px,1.2vw,14px);min-width:0}
.logo-mark{
  width:clamp(52px,6.8vh,62px);height:clamp(52px,6.8vh,62px);border-radius:clamp(17px,2.2vh,20px);
  background:linear-gradient(135deg,#071b34 0%,#0b6fd8 42%,#35a852 100%);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:clamp(26px,3.5vh,30px);font-weight:950;letter-spacing:-1px;
  box-shadow:0 18px 42px rgba(53,168,82,.22);
}
.brand strong{display:block;font-size:clamp(28px,3.9vh,34px);line-height:1;font-weight:950;letter-spacing:-1.2px;color:var(--navy)}
.brand strong span{color:var(--green)}
.brand small{display:block;margin-top:clamp(5px,.8vh,8px);color:#65758c;font-size:clamp(12px,1.55vh,14px);font-weight:750}
.user-panel{
  display:flex;align-items:center;gap:14px;
  min-height:clamp(60px,7.8vh,72px);
  border:1px solid #dfe9f5;
  border-radius:24px;
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(18px);
  box-shadow:0 18px 50px rgba(7,27,52,.07);
  padding:clamp(8px,1.2vh,10px) 14px clamp(8px,1.2vh,10px) 12px;
  min-width:0;
}
.avatar{
  width:clamp(44px,5.7vh,52px);height:clamp(44px,5.7vh,52px);border-radius:50%;
  background:linear-gradient(135deg,#1976ff,#22b14c);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:950;
  box-shadow:0 14px 28px rgba(25,118,255,.16);
  flex:0 0 auto;
}
.user-meta{min-width:clamp(120px,12vw,160px);max-width:240px}.user-meta b{display:block;color:#071b34;font-size:clamp(13px,1.55vh,15px);font-weight:950}.user-meta span{display:block;margin-top:3px;color:#1f64d8;font-size:clamp(11px,1.35vh,12px);font-weight:900}
.logout{
  height:clamp(42px,5.7vh,48px);padding:0 clamp(12px,1.5vw,18px);border-radius:16px;border:1px solid #fecaca;
  color:#dc2626;background:#fff7f7;font-weight:950;cursor:pointer;
  transition:.2s;
}
.logout:hover{background:#fee2e2;transform:translateY(-1px)}
.hero{
  border:1px solid rgba(223,233,245,.95);
  border-radius:34px;
  background:
    radial-gradient(circle at 64% 35%,rgba(34,177,76,.10),transparent 16%),
    radial-gradient(circle at 74% 42%,rgba(59,130,246,.10),transparent 20%),
    linear-gradient(135deg,rgba(255,255,255,.88),rgba(247,251,255,.82));
  box-shadow:0 24px 70px rgba(7,27,52,.075);
  min-height:clamp(104px,15vh,150px);
  display:grid;
  grid-template-columns:minmax(92px,clamp(104px,10vw,170px)) minmax(0,1fr) minmax(210px,24vw);
  align-items:center;
  gap:clamp(14px,1.8vw,24px);
  padding:clamp(16px,2.3vh,25px) clamp(20px,2.4vw,34px);
  overflow:hidden;
  position:relative;
}
.hero:before{
  content:"";
  position:absolute;right:230px;top:28px;width:480px;height:110px;
  background:
    linear-gradient(90deg,transparent,rgba(34,177,76,.10),transparent),
    repeating-linear-gradient(12deg,transparent 0 13px,rgba(59,130,246,.08) 14px);
  clip-path:polygon(0 76%,22% 48%,42% 65%,62% 30%,85% 50%,100% 18%,100% 100%,0 100%);
  opacity:.75;
}
.hero-icon{
  width:clamp(68px,8.9vh,86px);height:clamp(68px,8.9vh,86px);border-radius:clamp(21px,2.8vh,26px);
  background:linear-gradient(135deg,#fff,#eef7ff);
  border:1px solid #dfe9f5;
  display:flex;align-items:center;justify-content:center;
  color:#6691d8;font-size:clamp(31px,4.2vh,38px);
  box-shadow:0 18px 42px rgba(7,27,52,.055);
  justify-self:center;
}
.hero-text{position:relative;z-index:2;border-left:1px solid #d6e2f0;padding-left:clamp(18px,2vw,28px);min-width:0}
.hero h1{font-size:clamp(30px,3.9vh,36px);letter-spacing:-1.2px;line-height:1.04;color:#071b34;font-weight:950;margin-bottom:clamp(7px,1vh,11px)}
.hero p{color:#536176;font-size:clamp(13px,1.65vh,15px);font-weight:750;line-height:1.5;max-width:700px}
.hero-art{
  position:relative;z-index:2;min-height:clamp(78px,11.2vh,110px);display:flex;align-items:center;justify-content:center;
}
.building{
  width:clamp(180px,16vw,230px);height:clamp(76px,9.8vh,96px);position:relative;opacity:.95;
}
.tower{position:absolute;bottom:0;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,#dff9ee,#ffffff);border:1px solid #dbeafe;box-shadow:0 15px 35px rgba(59,130,246,.09)}
.t1{left:12px;width:48px;height:72px}.t2{left:68px;width:58px;height:95px}.t3{left:135px;width:45px;height:68px}
.shield{position:absolute;left:96px;bottom:5px;width:70px;height:78px;border-radius:26px;background:linear-gradient(135deg,#31c65b,#8be68d);display:flex;align-items:center;justify-content:center;color:white;font-size:34px;font-weight:950;box-shadow:0 18px 38px rgba(34,177,76,.22)}
.tree{position:absolute;bottom:0;width:16px;height:38px;border-radius:999px;background:#59cf78}.tr1{left:0}.tr2{right:0}
.grid-wrap{
  border:1px solid rgba(223,233,245,.95);
  border-radius:34px;
  background:rgba(255,255,255,.58);
  box-shadow:0 22px 60px rgba(7,27,52,.055);
  padding:clamp(14px,2vh,24px);
  flex:1;
  display:flex;
  flex-direction:column;
  min-height:0;
}
.departments{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(clamp(132px,14vw,190px),1fr));
  gap:clamp(10px,1.45vh,18px);
}
.dept-card{
  min-height:clamp(126px,18vh,205px);
  border:1px solid #bfe7ca;
  border-radius:22px;
  background:
    radial-gradient(circle at 86% 16%,rgba(34,177,76,.13),transparent 30%),
    linear-gradient(135deg,rgba(255,255,255,.96),rgba(250,255,252,.94));
  box-shadow:0 18px 46px rgba(7,27,52,.055),0 6px 18px rgba(34,177,76,.035);
  padding:clamp(12px,1.85vh,20px) clamp(12px,1.5vw,20px) clamp(12px,1.6vh,17px);
  position:relative;
  overflow:hidden;
  cursor:pointer;
  transition:.22s ease;
}
.dept-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(180deg,#22b14c,#63dc73);transition:.22s}
.dept-card:hover{transform:translateY(-5px) scale(1.018);box-shadow:0 30px 70px rgba(7,27,52,.10),0 14px 36px rgba(34,177,76,.13);border-color:#78d989}.dept-card:hover:before{width:6px}
.dept-card.locked{cursor:not-allowed;border-color:#dfe6ee;background:linear-gradient(135deg,rgba(255,255,255,.84),rgba(246,248,251,.95));box-shadow:0 12px 34px rgba(7,27,52,.035)}
.dept-card.locked:hover{transform:none;box-shadow:0 12px 34px rgba(7,27,52,.035);border-color:#dfe6ee}.dept-card.locked:hover:before{width:0}
.dept-card.development{cursor:not-allowed;border-color:#dceaf6;background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(245,249,255,.96));box-shadow:0 12px 34px rgba(7,27,52,.04)}
.dept-card.development .state{background:#eff6ff;color:#0ea5e9;box-shadow:none;font-size:18px}
.dept-card.development .badge{background:#eff6ff;color:#0369a1}
.dept-card.development .open-dot{background:#f8fbff;border-color:#dbeafe;color:#0ea5e9}
.dept-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:clamp(8px,1.45vh,18px)}
.dept-icon{
  width:clamp(44px,6.7vh,70px);height:clamp(44px,6.7vh,70px);border-radius:clamp(15px,2vh,20px);
  display:flex;align-items:center;justify-content:center;
  background:#effcf3;color:#16943b;font-size:clamp(24px,3.7vh,34px);
  box-shadow:0 14px 30px rgba(34,177,76,.10);
}
.locked .dept-icon{background:#f2f5f9;color:#7d8ca1;box-shadow:none}
.state{
  width:clamp(22px,3.1vh,28px);height:clamp(22px,3.1vh,28px);border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:#22b14c;color:white;font-weight:950;font-size:clamp(13px,1.8vh,16px);
  box-shadow:0 10px 22px rgba(34,177,76,.18);
}
.locked .state{background:transparent;color:#8a99ad;box-shadow:none;font-size:20px}
.dept-card h3{font-size:clamp(15px,2.2vh,20px);line-height:1.12;letter-spacing:-.45px;color:#071b34;font-weight:950;margin-bottom:clamp(7px,1.1vh,12px);min-height:clamp(34px,5.3vh,46px)}.locked h3{color:#26364b}
.badge{display:inline-flex;align-items:center;justify-content:center;min-height:clamp(22px,3vh,26px);border-radius:999px;padding:0 clamp(8px,1vw,10px);background:#dcfce7;color:#13843a;font-size:clamp(10px,1.35vh,12px);font-weight:950}.locked .badge{background:#eef2f7;color:#516177}
.open-dot{position:absolute;right:clamp(12px,1.4vw,18px);bottom:clamp(11px,1.5vh,17px);width:clamp(31px,4.6vh,40px);height:clamp(31px,4.6vh,40px);border-radius:50%;border:1px solid #bce9c6;background:#f4fff7;color:#16943b;display:flex;align-items:center;justify-content:center;font-size:clamp(19px,2.8vh,25px);font-weight:900;transition:.2s}.dept-card:hover .open-dot{background:#22b14c;color:white;border-color:#22b14c}.locked .open-dot{background:#eef2f7;border-color:#e2e8f0;color:#516177}
.footer-card{
  margin-top:clamp(10px,1.6vh,22px);
  min-height:clamp(58px,9.8vh,92px);
  border:1px solid #dfe9f5;
  border-radius:24px;
  background:
    radial-gradient(circle at 92% 50%,rgba(59,130,246,.11),transparent 18%),
    linear-gradient(135deg,rgba(255,255,255,.88),rgba(247,251,255,.84));
  box-shadow:0 16px 42px rgba(7,27,52,.045);
  display:flex;align-items:center;justify-content:space-between;gap:18px;
  padding:clamp(10px,1.8vh,18px) clamp(14px,1.8vw,24px);
}
.footer-left{display:flex;align-items:center;gap:clamp(12px,1.4vw,17px);min-width:0}.safe-icon{width:clamp(42px,6vh,58px);height:clamp(42px,6vh,58px);border-radius:clamp(15px,2vh,20px);background:#eef5ff;color:#1e5dc8;display:flex;align-items:center;justify-content:center;font-size:clamp(22px,3.3vh,29px);flex:0 0 auto}.footer-card b{display:block;color:#071b34;font-size:clamp(15px,1.9vh,18px);font-weight:950;margin-bottom:clamp(3px,.8vh,7px)}.footer-card span{color:#536176;font-size:clamp(12px,1.55vh,14px);font-weight:750}.lock-art{width:clamp(48px,7.3vh,82px);height:clamp(48px,7.3vh,82px);border-radius:clamp(18px,2.8vh,30px);background:linear-gradient(135deg,#eef5ff,#ffffff);display:flex;align-items:center;justify-content:center;color:#7b91b5;font-size:clamp(25px,4vh,42px);border:1px solid #dfe9f5;flex:0 0 auto}
.toast{position:fixed;right:24px;bottom:24px;z-index:20;display:none;max-width:430px;border-radius:18px;padding:15px 18px;background:linear-gradient(135deg,#071b34,#1f8f43);color:#fff;font-weight:900;box-shadow:0 22px 60px rgba(7,27,52,.24)}
@media(min-width:1200px){html,body{height:100%;overflow:hidden}.page{height:100vh;height:100svh;height:100dvh}.grid-wrap{overflow:hidden}.footer-card{flex:0 0 clamp(58px,9.8vh,92px)}}
@media(max-width:1350px) and (min-width:1051px){.hero{grid-template-columns:minmax(92px,9vw) minmax(0,1fr) minmax(210px,20vw)}.hero h1{font-size:clamp(29px,3.7vh,32px)}}
@media(max-width:1050px){html,body{height:auto;overflow-x:hidden;overflow-y:auto}.page{padding:20px;overflow:visible}.topbar{flex-direction:column;align-items:flex-start}.user-panel{width:100%;justify-content:space-between}.hero{grid-template-columns:1fr;padding:24px}.hero-icon,.hero-art{display:none}.hero-text{border-left:0;padding-left:0}.departments{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.footer-card{margin-bottom:20px}}
@media(max-width:700px){.brand strong{font-size:27px}.logo-mark{width:54px;height:54px}.user-panel{display:grid;grid-template-columns:auto 1fr}.logout{grid-column:1/-1;width:100%}.departments{grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.dept-card{min-height:155px;padding:16px}.dept-icon{width:56px;height:56px;font-size:28px}.dept-card h3{font-size:17px}.footer-card{align-items:flex-start;flex-direction:column}.lock-art{display:none}}
@media(max-width:460px){.departments{grid-template-columns:1fr}.hero h1{font-size:28px}.grid-wrap{padding:16px}}

function unwrapApiData(response){
  if(!response) return null;
  if(response.success === true && response.data !== undefined) return response.data;
  return response;
}

function unwrapMeUser(response){
  const data = unwrapApiData(response);
  return data?.user || data?.data?.user || data;
}

function redirectToLoginOnce(reason){
  const target = "index.html" + (reason ? "?auth=" + encodeURIComponent(reason) : "");
  if((window.location.pathname.split("/").pop() || "") === "index.html") return;
  window.location.replace(target);
}

const ICON_MAP = {
  "Yönetim":"👑", "Kalite":"🏅", "Kalite Yönetimi":"🏅", "Üretim":"🏭", "Ar-Ge":"💡", "Satınalma":"🛒",
  "Planlama":"🗓️", "Tedarik Zinciri":"🚚", "Tedarik":"🚚", "Depo":"🏬", "İnsan Kaynakları":"👥",
  "Laboratuvar":"🧪", "Bilgi Teknolojileri":"🖥️", "Finans":"🏛️", "Muhasebe":"🧾", "Satış":"📈",
  "Pazarlama":"📣", "Satış Pazarlama":"📈", "İdari İşler":"📁", "Bakım":"🛠️", "Bakım & Teknik":"🛠️",
  "Kalıphane":"🏗️", "Enerji":"⚡", "İSG":"🦺", "Çevre":"🌱", "BGYS":"🔒", "İç Denetim":"🔎", "Denetim":"🔎"
};

function apiUrl(path){
  if(!path.startsWith("/")) path = "/" + path;
  return GDNL_API_BASE + path;
}

async function parseApiResponse(res){
  const raw = await res.text();
  if(!raw) return null;
  try{
    return JSON.parse(raw);
  }catch(err){
    return raw;
  }
}

async function apiGet(path, fallbackValue = null){
  try{
    const res = await fetch(apiUrl(path), {
      method:"GET",
      cache:"no-store",
      mode:"cors",
      credentials:"include",
      headers:{"Accept":"application/json"}
    });
    if(!res.ok) throw new Error(path + " yanıt hatası: " + res.status);
    return await parseApiResponse(res);
  }catch(err){
    console.warn("D1 okuma hatası:", path, err);
    return fallbackValue;
  }
}

async function apiPost(path, payload, fallbackValue = null){
  try{
    const res = await fetch(apiUrl(path), {
      method:"POST",
      credentials:"include",
      mode:"cors",
      headers:{"Content-Type":"application/json","Accept":"application/json"},
      body:JSON.stringify(payload || {})
    });
    if(!res.ok) throw new Error(path + " yanıt hatası: " + res.status);
    return await parseApiResponse(res);
  }catch(err){
    console.warn("D1 yazma hatası:", path, err);
    return fallbackValue;
  }
}

function normalizeList(response, preferredKey = ""){
  if(Array.isArray(response)) return response;
  if(!response || typeof response !== "object") return [];
  if(preferredKey && Array.isArray(response[preferredKey])) return response[preferredKey];
  const keys = ["data","items","results","rows","users","departments","actions","assignments","notifications","comments","approvals","documents","archive","permissions","roles"];
  for(const key of keys){
    if(Array.isArray(response[key])) return response[key];
  }
  return [];
}

function getClientMeta(){
  return {
    ip_address:"",
    user_agent:navigator.userAgent,
    session_id:state.session?.session_id || state.session?.id ||""
  };
}

function nowISO(){ return new Date().toISOString(); }

function isArchivedStatus(status){
  return ARCHIVE_STATUSES.includes(String(status ||"").trim());
}

function parseJSON(value){
  if(!value || typeof value !== "string") return null;
  try{return JSON.parse(value)}catch(err){return null}
}

function parseModules(value){
  if(!value) return null;
  if(Array.isArray(value)) return value;
  const parsed = parseJSON(value);
  if(Array.isArray(parsed)) return parsed;
  return String(value).split(",").map(x=>x.trim()).filter(Boolean);
}

function normalizeRole(role){
  const r = String(role || "Kullanıcı").trim();
  const low = r.toLocaleLowerCase("tr-TR");
  if(low.includes("root") && low.includes("super")) return "Kök Süper Yönetici";
  if(low.includes("super administrator")) return "Süper Yönetici";
  if(low === "administrator") return "Yönetici";
  if(low === "admin") return "Yönetici";
  if(low === "user") return "Kullanıcı";
  if(low === "guest") return "Misafir";
  return r;
}

function normalizeUser(row){
  const user = row || {};
  const fullname = user.fullname || user.fullName || user.name || user.username || user.email || "Oturum doğrulanıyor";
  return {
    ...user,
    id:user.id || user.user_id || user.username || fullname,
    fullname,
    name:fullname,
    username:String(user.username ||"").trim(),
    email:String(user.email ||"").trim(),
    role:user.role || "Kullanıcı",
    role_tr:normalizeRole(user.role || "Kullanıcı"),
    department:user.department || user.department_name ||"",
    status:user.status || "Aktif",
    permissions:Array.isArray(user.permissions) ? user.permissions : parseModules(user.permissions) || [],
    departments:Array.isArray(user.departments) ? user.departments : parseModules(user.departments) || []
  };
}

function isQualityDepartmentName(name){
  const value = String(name || "").trim().toLocaleLowerCase("tr-TR");
  return ACTIVE_PRODUCT_NAMES.some((item) => value === item || value.includes(item));
}

function isManagementDepartmentName(name){
  const value = String(name || "").trim().toLocaleLowerCase("tr-TR");
  return value === "yönetim" || value === "yonetim" || value.includes("yönetim merkezi") || value.includes("yonetim merkezi");
}

function isHrDepartmentName(name){
  const value = String(name || "").trim().toLocaleLowerCase("tr-TR");
  return value === "insan kaynakları" || value === "insan kaynaklari" || value === "ik" || value.includes("insan kaynak");
}

function isMaintenanceDepartmentName(name){
  const value = String(name || "").trim().toLocaleLowerCase("tr-TR");
  return value === "bakım" || value === "bakim" || value.includes("bakım") || value.includes("bakim");
}

function normalizeDepartment(row){
  const name = row.department_name || row.name || row.key || row.title ||"";
  const cleanName = String(name).trim();
  return {
    ...row,
    id:row.id || row.department_id || cleanName,
    key:cleanName,
    accessKey:cleanName,
    department_name:cleanName,
    status:row.status || "Aktif",
    icon:row.icon || ICON_MAP[cleanName] || "▦",
    modules:isQualityDepartmentName(cleanName) ? (parseModules(row.modules) || MODULE_MAP[cleanName] || MODULE_MAP["Kalite"]) : []
  };
}

function isSuperAdmin(user = state.currentUser || state.session || {}){
  const role = String(user.role ||"").trim().toLocaleLowerCase("tr-TR");
  const perms = Array.isArray(user.permissions) ? user.permissions : [];

  return user.isRoot === true ||
    user.isSuperAdmin === true ||
    user.isFullAuthorized === true ||
    user.canAccessAllModules === true ||
    user.accessLevel === "FULL_SYSTEM_ACCESS" ||
    perms.includes("*") ||
    role === "super_admin" ||
    role.includes("super_admin") ||
    role.includes("super admin") ||
    role.includes("super administrator") ||
    role.includes("root") ||
    role.includes("süper yönetici");
}

function findBestCloudUser(users){
  const url = new URL(window.location.href);
  const username = String(url.searchParams.get("username") ||"").trim().toLocaleLowerCase("tr-TR");
  const email = String(url.searchParams.get("email") ||"").trim().toLocaleLowerCase("tr-TR");

  if(username || email){
    const match = users.find(u =>
      String(u.username ||"").toLocaleLowerCase("tr-TR") === username ||
      String(u.email ||"").toLocaleLowerCase("tr-TR") === email
    );
    if(match) return match;
  }

  return users.find(u => isSuperAdmin(u)) || users[0] || null;
}

async function loadCloudSession(users){
  /*
    KRİTİK DÜZELTME:
    Eski sürüm /session boş gelirse users listesinden ilk SUPER_ADMIN veya ilk kullanıcıyı seçiyordu.
    Bu nedenle login Kerem ile yapılmasına rağmen başka kullanıcı ekrana basılabiliyordu.

    Yeni kural:
    - Oturum kullanıcısı yalnızca GET /me üzerinden alınır.
    - /me yoksa fallback kullanıcı seçilmez.
    - Kullanıcı login ekranına yönlendirilir.
  */
  const meResponse = await apiGet("/me", null);
  const meUser = unwrapMeUser(meResponse);

  if(!meUser || typeof meUser !== "object" || !meUser.username){
    showToast("Oturum bulunamadı. Lütfen tekrar giriş yapın.");
    setTimeout(() => {
      redirectToLoginOnce("expired");
    }, 900);
    return null;
  }

  return normalizeUser(meUser);
}

function hasPermission(permission){
  if(isSuperAdmin()) return true;
  const permissions = state.permissions.length ? state.permissions : (state.currentUser?.permissions || []);
  return permissions.includes(permission) || permissions.includes("*");
}

function canAccessDepartment(department){
  if(!isQualityDepartmentName(department?.department_name || department?.name || department?.key)) return false;
  if(isSuperAdmin()) return true;
  const depName = String(department?.department_name || department?.name || department?.key ||"").trim();
  const userDep = String(state.currentUser?.department ||"").trim();
  const permissions = state.permissions.length ? state.permissions : (state.currentUser?.permissions || []);
  const userDepartments = Array.isArray(state.currentUser?.departments) ? state.currentUser.departments : [];

  if(depName && userDep && depName.toLocaleLowerCase("tr-TR") === userDep.toLocaleLowerCase("tr-TR")) return true;
  if(userDepartments.some(x => String(x).toLocaleLowerCase("tr-TR") === depName.toLocaleLowerCase("tr-TR"))) return true;
  if(permissions.includes("departments:view:all")) return true;
  if(permissions.includes("all_departments")) return true;
  if(permissions.includes("department:" + depName)) return true;
  if(permissions.includes("departman:" + depName)) return true;
  return false;
}

async function loadCloudData(){
  const [usersResponse, departmentsResponse] = await Promise.all([
    apiGet("/users", []),
    apiGet("/departments", [])
  ]);

  state.users = normalizeList(usersResponse, "users")
    .map(normalizeUser)
    .filter(x => !isArchivedStatus(x.status));

  state.departments = normalizeList(departmentsResponse, "departments")
    .map(normalizeDepartment)
    .filter(x => x.department_name && !isArchivedStatus(x.status));

  const [rolesResponse, permissionsResponse] = await Promise.all([
    apiGet("/roles", []),
    apiGet("/permissions", [])
  ]);

  state.currentUser = await loadCloudSession(state.users);
  state.session = state.currentUser;
  state.permissions = extractPermissions(rolesResponse, permissionsResponse, state.currentUser);
}

function extractPermissions(rolesResponse, permissionsResponse, user){
  const direct = Array.isArray(user?.permissions) ? user.permissions : [];
  const roleName = String(user?.role ||"").trim();
  const roles = normalizeList(rolesResponse, "roles");
  const permissions = normalizeList(permissionsResponse, "permissions");
  const role = roles.find(r => String(r.role_name || r.name || r.title ||"").trim() === roleName);
  const roleId = role?.id || role?.role_id ||"";
  const rolePermissions = permissions
    .filter(p => String(p.role_id || p.roleId ||"") === String(roleId) || String(p.role_name || p.role ||"") === roleName)
    .map(p => p.permission_key || p.permission || p.name)
    .filter(Boolean);
  return [...new Set([...direct, ...rolePermissions])];
}

function initials(name){
  return "";
}

function render(){
  const currentUser = state.currentUser || {};

  if(!currentUser.username){
    document.getElementById("userName").textContent = "";
    document.getElementById("userRole").textContent = "Giriş Gerekli";
    document.getElementById("avatar").textContent = "";
    document.getElementById("departmentGrid").innerHTML = '<div class="dept-card locked" style="grid-column:1/-1"><div class="dept-top"><div class="dept-icon">!</div><div class="state">🔒</div></div><h3>Oturum doğrulanamadı</h3><span class="badge">Tekrar giriş yapınız</span><div class="open-dot">!</div></div>';
    return;
  }

  document.getElementById("userName").textContent = currentUser.fullname || currentUser.name ||"";
  document.getElementById("userRole").textContent = normalizeRole(currentUser.role || "Kullanıcı");
  document.getElementById("avatar").textContent = "";

  const departments = state.departments;
  const active = departments.filter(d => canAccessDepartment(d));
  const development = departments.filter(d => !isQualityDepartmentName(d.department_name));
  const locked = departments.filter(d => isQualityDepartmentName(d.department_name) && !canAccessDepartment(d));
  const ordered = [...active.map(d => ({d, ok:true, development:false})), ...locked.map(d => ({d, ok:false, development:false})), ...development.map(d => ({d, ok:false, development:true}))];
  const area = document.getElementById("departmentGrid");

  if(!ordered.length){
    area.innerHTML = '<div class="dept-card locked" style="grid-column:1/-1"><div class="dept-top"><div class="dept-icon">!</div><div class="state">🔒</div></div><h3>Departman bulunamadı</h3><span class="badge">Kayıt servisi kontrol edilmeli</span><div class="open-dot">!</div></div>';
    return;
  }

  area.innerHTML = ordered.map(x => cardHTML(x.d, x.ok, x.development)).join("");
}

function cardHTML(d, ok, development){
  return `<article class="dept-card ${ok ? "" : (development ? "development" : "locked")}" onclick="openDepartment('${escapeJS(d.id)}')">
    <div class="dept-top"><div class="dept-icon">${escapeHTML(d.icon)}</div><div class="state">${ok ? "✓" : (development ? "…" : "🔒")}</div></div>
    <h3>${escapeHTML(d.department_name)}</h3>
    <span class="badge">${ok ? "Erişilebilir" : (development ? "Geliştirme aşamasında" : "Yetkiniz yok")}</span>
    <div class="open-dot">→</div>
  </article>`;
}

async function openDepartment(departmentId){
  const dept = state.departments.find(d => String(d.id) === String(departmentId));
  if(!dept){
    showToast("Departman kaydı bulunamadı.");
    return;
  }

  if(!isQualityDepartmentName(dept.department_name)){
    showToast(dept.department_name + " departmanı geliştirme aşamasındadır. Aktif ürün Kalite Suite’tir.");
    return;
  }

  if(!canAccessDepartment(dept)){
    showToast(dept.department_name + " departmanı için yetkiniz bulunmamaktadır.");
    await logAudit("Yetkisiz departman erişim denemesi", dept.department_name, {department_id:dept.id});
    return;
  }

  state.selectedDepartment = dept;
  await Promise.all([
    logAudit("Departman seçildi", dept.department_name, {department_id:dept.id, modules:dept.modules}),
    logActivity("Departman çalışma alanı açıldı", dept.department_name, {department_id:dept.id}),
    createNotificationIfNeeded(dept)
  ]);

  const targetPage = "dashboard.html";
  const target = new URL(targetPage, window.location.href);
  target.searchParams.set("department", dept.department_name);
  target.searchParams.set("department_id", dept.id);
  target.searchParams.set("source", "department-gateway");

  showToast(dept.department_name + " çalışma alanı açılıyor...");
  setTimeout(() => { window.location.href = target.toString(); }, 450);
}

async function createNotificationIfNeeded(dept){
  const payload = {
    module:SYSTEM_MODULE,
    title:"Departman çalışma alanı seçildi",
    message:(state.currentUser?.fullname || state.currentUser?.username || "Oturum kullanıcısı") + " kullanıcısı " + dept.department_name + " çalışma alanına geçti.",
    user_id:state.currentUser?.id ||"",
    user_name:state.currentUser?.fullname ||"",
    department:dept.department_name,
    status:"Okunmadı",
    is_read:0,
    read_by:"",
    read_at:"",
    created_at:nowISO()
  };
  return apiPost("/notifications", payload, null);
}

async function logAudit(action, recordNo, extra = {}){
  const payload = {
    module:SYSTEM_MODULE,
    related_id:recordNo ||"",
    action:action,
    old_value:extra.old_value ||"",
    new_value:JSON.stringify(extra),
    changed_field:extra.changed_field ||"",
    user_id:state.currentUser?.id ||"",
    user_name:state.currentUser?.fullname ||"",
    role:state.currentUser?.role ||"",
    department:state.currentUser?.department ||"",
    created_at:nowISO(),
    ...getClientMeta()
  };
  return apiPost("/audit-logs", payload, null);
}

async function logActivity(action, recordNo, extra = {}){
  const payload = {
    module:SYSTEM_MODULE,
    related_id:recordNo ||"",
    action:action,
    description:action + " / " + (recordNo ||""),
    user_id:state.currentUser?.id ||"",
    user_name:state.currentUser?.fullname ||"",
    department:state.currentUser?.department ||"",
    old_value:extra.old_value ||"",
    new_value:JSON.stringify(extra),
    changed_field:extra.changed_field ||"",
    created_at:nowISO()
  };
  return apiPost("/activity-feed", payload, null);
}

async function requestSequence(moduleName){
  const response = await apiGet("/sequence?module=" + encodeURIComponent(moduleName || SYSTEM_MODULE), null);
  return response?.sequence || response?.no || response?.number ||"";
}

async function archiveDepartmentReference(departmentId, reason){
  const dept = state.departments.find(d => String(d.id) === String(departmentId));
  if(!dept || !canAccessDepartment(dept)) return false;
  const payload = {
    module:SYSTEM_MODULE,
    related_id:dept.id,
    record_no:dept.department_name,
    status:"Arşivlendi",
    archived_by:state.currentUser?.fullname ||"",
    archived_at:nowISO(),
    archive_reason:reason || "Departman bağlantısı arşivlendi"
  };
  await apiPost("/archive", payload, null);
  await logAudit("Departman bağlantısı arşivlendi", dept.department_name, payload);
  await logActivity("Departman bağlantısı arşivlendi", dept.department_name, payload);
  return true;
}

async function restoreDepartmentReference(departmentId){
  const dept = state.departments.find(d => String(d.id) === String(departmentId));
  if(!dept) return false;
  const payload = {
    module:SYSTEM_MODULE,
    related_id:dept.id,
    record_no:dept.department_name,
    restored_by:state.currentUser?.fullname ||"",
    restored_at:nowISO()
  };
  await apiPost("/restore", payload, null);
  await logAudit("Departman bağlantısı geri yüklendi", dept.department_name, payload);
  await logActivity("Departman bağlantısı geri yüklendi", dept.department_name, payload);
  return true;
}

function logout(){
  if(window.GDNL_API?.logout){
    window.GDNL_API.logout();
    return;
  }
  logAudit("Oturum kapatıldı", state.currentUser?.fullname ||"", {}).finally(async () => {
    await apiPost("/logout", {user_id:state.currentUser?.id ||"", created_at:nowISO()}, null);
    window.location.replace("index.html?logout=1");
  });
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => t.style.display = "none", 2500);
}

function escapeHTML(value){
  return String(value ||"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function escapeJS(value){
  return String(value ||"")
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'");
}

async function boot(){
  showToast("Departman ve kullanıcı kayıtları yükleniyor...");
  await loadCloudData();

  if(!state.currentUser || !state.currentUser.username){
    render();
    return;
  }

  if(!state.users.length){
    showToast("Kullanıcı kayıtları alınamadı. Lütfen sistem yöneticisiyle iletişime geçin.");
  }

  if(!state.departments.length){
    showToast("Departman kayıtları alınamadı. Lütfen sistem yöneticisiyle iletişime geçin.");
  }

  render();
  await logActivity("Departman Merkezi açıldı", state.currentUser?.fullname ||"", {});
}

boot();
</script>
