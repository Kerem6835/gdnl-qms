<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GDNL EQMS | Departman Merkezi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#071b34;
  --text:#0f1b2f;
  --muted:#617086;
  --line:#dfe9f5;
  --green:#22b14c;
  --green2:#63dc73;
  --red:#b91c1c;
  --blue:#3b82f6;
  --soft:#f7fbff;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif}
html,body{width:100%;min-height:100%;overflow-x:hidden}
body{
  color:var(--text);
  background:
    radial-gradient(circle at 85% 9%,rgba(34,177,76,.13),transparent 27%),
    radial-gradient(circle at 12% 17%,rgba(59,130,246,.12),transparent 26%),
    linear-gradient(135deg,#fbfdff 0%,#edf5ff 45%,#f9fcff 100%);
}
body:before{
  content:"";
  position:fixed;
  inset:0;
  background:
    linear-gradient(90deg,rgba(255,255,255,.90),rgba(255,255,255,.42) 48%,rgba(255,255,255,.86)),
    radial-gradient(circle at 50% 100%,rgba(34,177,76,.06),transparent 36%);
  pointer-events:none;
}
.page{
  position:relative;
  z-index:1;
  min-height:100dvh;
  padding:26px 32px 28px;
  display:flex;
  flex-direction:column;
  gap:18px;
}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  min-height:80px;
}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo-mark{
  width:62px;height:62px;border-radius:20px;
  background:linear-gradient(135deg,#071b34 0%,#0b6fd8 42%,#35a852 100%);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:30px;font-weight:950;letter-spacing:-1px;
  box-shadow:0 18px 42px rgba(53,168,82,.22);
}
.brand strong{display:block;font-size:34px;line-height:1;font-weight:950;letter-spacing:-1.2px;color:var(--navy)}
.brand strong span{color:var(--green)}
.brand small{display:block;margin-top:8px;color:#65758c;font-size:14px;font-weight:750}
.user-panel{
  display:flex;align-items:center;gap:14px;
  min-height:72px;
  border:1px solid #dfe9f5;
  border-radius:24px;
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(18px);
  box-shadow:0 18px 50px rgba(7,27,52,.07);
  padding:10px 14px 10px 12px;
}
.avatar{
  width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,#1976ff,#22b14c);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:950;
  box-shadow:0 14px 28px rgba(25,118,255,.16);
  flex:0 0 auto;
}
.user-meta{min-width:160px}.user-meta b{display:block;color:#071b34;font-size:15px;font-weight:950}.user-meta span{display:block;margin-top:3px;color:#1f64d8;font-size:12px;font-weight:900}
.logout{
  height:48px;padding:0 18px;border-radius:16px;border:1px solid #fecaca;
  color:#dc2626;background:#fff7f7;font-weight:950;cursor:pointer;
  transition:.2s;
}
.logout:hover{background:#fee2e2;transform:translateY(-1px)}
.hero{
  border:1px solid rgba(223,233,245,.95);
  border-radius:34px;
  background:
    radial-gradient(circle at 64% 35%,rgba(34,177,76,.10),transparent 16%),
    radial-gradient(circle at 74% 42%,rgba(59,130,246,.10),transparent 20%),
    linear-gradient(135deg,rgba(255,255,255,.88),rgba(247,251,255,.82));
  box-shadow:0 24px 70px rgba(7,27,52,.075);
  min-height:150px;
  display:grid;
  grid-template-columns:170px minmax(0,1fr) 390px;
  align-items:center;
  gap:24px;
  padding:25px 34px;
  overflow:hidden;
  position:relative;
}
.hero:before{
  content:"";
  position:absolute;right:230px;top:28px;width:480px;height:110px;
  background:
    linear-gradient(90deg,transparent,rgba(34,177,76,.10),transparent),
    repeating-linear-gradient(12deg,transparent 0 13px,rgba(59,130,246,.08) 14px);
  clip-path:polygon(0 76%,22% 48%,42% 65%,62% 30%,85% 50%,100% 18%,100% 100%,0 100%);
  opacity:.75;
}
.hero-icon{
  width:86px;height:86px;border-radius:26px;
  background:linear-gradient(135deg,#fff,#eef7ff);
  border:1px solid #dfe9f5;
  display:flex;align-items:center;justify-content:center;
  color:#6691d8;font-size:38px;
  box-shadow:0 18px 42px rgba(7,27,52,.055);
  justify-self:center;
}
.hero-text{position:relative;z-index:2;border-left:1px solid #d6e2f0;padding-left:28px}
.hero h1{font-size:36px;letter-spacing:-1.2px;line-height:1.04;color:#071b34;font-weight:950;margin-bottom:11px}
.hero p{color:#536176;font-size:15px;font-weight:750;line-height:1.55;max-width:700px}
.hero-art{
  position:relative;z-index:2;min-height:110px;display:flex;align-items:center;justify-content:center;
}
.building{
  width:230px;height:96px;position:relative;opacity:.95;
}
.tower{position:absolute;bottom:0;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,#dff9ee,#ffffff);border:1px solid #dbeafe;box-shadow:0 15px 35px rgba(59,130,246,.09)}
.t1{left:12px;width:48px;height:72px}.t2{left:68px;width:58px;height:95px}.t3{left:135px;width:45px;height:68px}
.shield{position:absolute;left:96px;bottom:5px;width:70px;height:78px;border-radius:26px;background:linear-gradient(135deg,#31c65b,#8be68d);display:flex;align-items:center;justify-content:center;color:white;font-size:34px;font-weight:950;box-shadow:0 18px 38px rgba(34,177,76,.22)}
.tree{position:absolute;bottom:0;width:16px;height:38px;border-radius:999px;background:#59cf78}.tr1{left:0}.tr2{right:0}
.grid-wrap{
  border:1px solid rgba(223,233,245,.95);
  border-radius:34px;
  background:rgba(255,255,255,.58);
  box-shadow:0 22px 60px rgba(7,27,52,.055);
  padding:24px;
  flex:1;
  display:flex;
  flex-direction:column;
  min-height:0;
}
.departments{
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:18px;
}
.dept-card{
  min-height:205px;
  border:1px solid #bfe7ca;
  border-radius:22px;
  background:
    radial-gradient(circle at 86% 16%,rgba(34,177,76,.13),transparent 30%),
    linear-gradient(135deg,rgba(255,255,255,.96),rgba(250,255,252,.94));
  box-shadow:0 18px 46px rgba(7,27,52,.055),0 6px 18px rgba(34,177,76,.035);
  padding:20px 20px 17px;
  position:relative;
  overflow:hidden;
  cursor:pointer;
  transition:.22s ease;
}
.dept-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(180deg,#22b14c,#63dc73);transition:.22s}
.dept-card:hover{transform:translateY(-5px) scale(1.018);box-shadow:0 30px 70px rgba(7,27,52,.10),0 14px 36px rgba(34,177,76,.13);border-color:#78d989}.dept-card:hover:before{width:6px}
.dept-card.locked{cursor:not-allowed;border-color:#dfe6ee;background:linear-gradient(135deg,rgba(255,255,255,.84),rgba(246,248,251,.95));box-shadow:0 12px 34px rgba(7,27,52,.035)}
.dept-card.locked:hover{transform:none;box-shadow:0 12px 34px rgba(7,27,52,.035);border-color:#dfe6ee}.dept-card.locked:hover:before{width:0}
.dept-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px}
.dept-icon{
  width:70px;height:70px;border-radius:20px;
  display:flex;align-items:center;justify-content:center;
  background:#effcf3;color:#16943b;font-size:34px;
  box-shadow:0 14px 30px rgba(34,177,76,.10);
}
.locked .dept-icon{background:#f2f5f9;color:#7d8ca1;box-shadow:none}
.state{
  width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:#22b14c;color:white;font-weight:950;font-size:16px;
  box-shadow:0 10px 22px rgba(34,177,76,.18);
}
.locked .state{background:transparent;color:#8a99ad;box-shadow:none;font-size:20px}
.dept-card h3{font-size:20px;line-height:1.12;letter-spacing:-.45px;color:#071b34;font-weight:950;margin-bottom:12px;min-height:46px}.locked h3{color:#26364b}
.badge{display:inline-flex;align-items:center;justify-content:center;min-height:26px;border-radius:999px;padding:0 10px;background:#dcfce7;color:#13843a;font-size:12px;font-weight:950}.locked .badge{background:#eef2f7;color:#516177}
.open-dot{position:absolute;right:18px;bottom:17px;width:40px;height:40px;border-radius:50%;border:1px solid #bce9c6;background:#f4fff7;color:#16943b;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:900;transition:.2s}.dept-card:hover .open-dot{background:#22b14c;color:white;border-color:#22b14c}.locked .open-dot{background:#eef2f7;border-color:#e2e8f0;color:#516177}
.footer-card{
  margin-top:22px;
  min-height:92px;
  border:1px solid #dfe9f5;
  border-radius:24px;
  background:
    radial-gradient(circle at 92% 50%,rgba(59,130,246,.11),transparent 18%),
    linear-gradient(135deg,rgba(255,255,255,.88),rgba(247,251,255,.84));
  box-shadow:0 16px 42px rgba(7,27,52,.045);
  display:flex;align-items:center;justify-content:space-between;gap:18px;
  padding:18px 24px;
}
.footer-left{display:flex;align-items:center;gap:17px}.safe-icon{width:58px;height:58px;border-radius:20px;background:#eef5ff;color:#1e5dc8;display:flex;align-items:center;justify-content:center;font-size:29px}.footer-card b{display:block;color:#071b34;font-size:18px;font-weight:950;margin-bottom:7px}.footer-card span{color:#536176;font-size:14px;font-weight:750}.lock-art{width:82px;height:82px;border-radius:30px;background:linear-gradient(135deg,#eef5ff,#ffffff);display:flex;align-items:center;justify-content:center;color:#7b91b5;font-size:42px;border:1px solid #dfe9f5}
.toast{position:fixed;right:24px;bottom:24px;z-index:20;display:none;max-width:430px;border-radius:18px;padding:15px 18px;background:linear-gradient(135deg,#071b34,#1f8f43);color:#fff;font-weight:900;box-shadow:0 22px 60px rgba(7,27,52,.24)}
@media(min-width:1200px){html,body{height:100%;overflow:hidden}.page{height:100vh}.grid-wrap{overflow:hidden}.departments{grid-template-columns:repeat(6,minmax(0,1fr))}.dept-card{min-height:185px}.footer-card{flex:0 0 92px}}
@media(max-width:1350px){.departments{grid-template-columns:repeat(5,minmax(0,1fr))}.dept-card{min-height:180px}.hero{grid-template-columns:120px 1fr 260px}.hero h1{font-size:32px}}
@media(max-width:1050px){html,body{overflow:auto}.page{padding:20px}.topbar{flex-direction:column;align-items:flex-start}.user-panel{width:100%;justify-content:space-between}.hero{grid-template-columns:1fr;padding:24px}.hero-icon,.hero-art{display:none}.hero-text{border-left:0;padding-left:0}.departments{grid-template-columns:repeat(3,minmax(0,1fr))}.footer-card{margin-bottom:20px}}
@media(max-width:700px){.brand strong{font-size:27px}.logo-mark{width:54px;height:54px}.user-panel{display:grid;grid-template-columns:auto 1fr}.logout{grid-column:1/-1;width:100%}.departments{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.dept-card{min-height:165px;padding:16px}.dept-icon{width:56px;height:56px;font-size:28px}.dept-card h3{font-size:17px}.footer-card{align-items:flex-start;flex-direction:column}.lock-art{display:none}}
@media(max-width:460px){.departments{grid-template-columns:1fr}.hero h1{font-size:28px}.grid-wrap{padding:16px}}
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <div class="brand">
      <div class="logo-mark">G</div>
      <div>
        <strong>GDNL <span>EQMS</span></strong>
        <small>Kurumsal Yönetim Platformu</small>
      </div>
    </div>

    <div class="user-panel">
      <div class="avatar" id="avatar">KG</div>
      <div class="user-meta">
        <b id="userName">Kerem Güdenli</b>
        <span>Rol: <span id="userRole">Super Administrator</span></span>
      </div>
      <button class="logout" onclick="logout()">⇥ Oturumu Kapat</button>
    </div>
  </header>

  <main class="grid-wrap">
    <section class="hero">
      <div class="hero-icon">▦</div>
      <div class="hero-text">
        <h1>Departman Merkezi</h1>
        <p>Çalışma alanınıza erişmek için bir departman seçiniz.</p>
      </div>
      <div class="hero-art">
        <div class="building">
          <div class="tower t1"></div><div class="tower t2"></div><div class="tower t3"></div>
          <div class="tree tr1"></div><div class="tree tr2"></div>
          <div class="shield">✓</div>
        </div>
      </div>
    </section>

    <section class="departments" id="departmentGrid"></section>

    <section class="footer-card">
      <div class="footer-left">
        <div class="safe-icon">🛡</div>
        <div>
          <b>Rol Bazlı Erişim</b>
          <span>Erişilebilir departmanlar yeşil olarak gösterilir. Yetkiniz olmayan departmanlar kilitli görünür.</span>
        </div>
      </div>
      <div class="lock-art">🔒</div>
    </section>
  </main>
</div>
<div class="toast" id="toast">İşlem tamamlandı</div>
<script>
const DEFAULT_SESSION={username:"demo",name:"Demo Kullanıcı",role:"Kullanıcı",department:"Kalite",loginAt:new Date().toISOString()};

function readSession(){
  const emsSession=JSON.parse(localStorage.getItem("gdnl_ems_session")||"null");
  const qdmsSession=JSON.parse(localStorage.getItem("gdnl_qdms_session")||"null");
  const activeSession=emsSession||qdmsSession||DEFAULT_SESSION;

  if(activeSession.username==="keremgudenli"){
    activeSession.name="Kerem Güdenli";
    activeSession.role="Root Super Administrator";
    activeSession.department="Yönetim";
    activeSession.accessLevel="FULL_SYSTEM_ACCESS";
    activeSession.permissions=["*","root","admin","view","create","edit","delete","approve","export","import","audit","settings","users","roles","system","all_modules"];
    activeSession.canViewAll=true;
    activeSession.canCreate=true;
    activeSession.canEdit=true;
    activeSession.canDelete=true;
    activeSession.canApprove=true;
    activeSession.canExport=true;
    activeSession.canImport=true;
    activeSession.canAudit=true;
    activeSession.canManageUsers=true;
    activeSession.canManageRoles=true;
    activeSession.canManageSystem=true;
    activeSession.canAccessSettings=true;
    activeSession.canAccessAllModules=true;
    activeSession.canOverrideWorkflow=true;
    activeSession.isRoot=true;
    activeSession.isSuperAdmin=true;
    activeSession.isFullAuthorized=true;
  }

  if(!activeSession.name)activeSession.name="Demo Kullanıcı";
  if(!activeSession.role)activeSession.role="Kullanıcı";
  if(!activeSession.department)activeSession.department=activeSession.role==="Super Administrator"||activeSession.role==="Root Super Administrator"?"Yönetim":"Kalite";

  localStorage.setItem("gdnl_qdms_session",JSON.stringify(activeSession));
  localStorage.setItem("gdnl_ems_session",JSON.stringify(activeSession));
  return activeSession;
}

let session=readSession();

function isFullAccess(){
  return session.isRoot===true ||
    session.isSuperAdmin===true ||
    session.isFullAuthorized===true ||
    session.canAccessAllModules===true ||
    session.accessLevel==="FULL_SYSTEM_ACCESS" ||
    (session.permissions||[]).includes("*") ||
    session.role==="Super Administrator" ||
    session.role==="Root Super Administrator";
}

const departments=[
  {key:"Kalite Yönetimi",accessKey:"Kalite",icon:"🏅",modules:["documents.html","capa.html","risk-register.html","audit.html","standards-compliance.html"]},
  {key:"Üretim",accessKey:"Üretim",icon:"🏭",modules:["process-management.html","control-plan.html","spc.html","capa.html"]},
  {key:"Ar-Ge",accessKey:"Ar-Ge",icon:"💡",modules:["apqp.html","fmea.html","control-plan.html","ppap.html"]},
  {key:"Satınalma",accessKey:"Satınalma",icon:"🛒",modules:["supplier-management.html","approval.html","documents.html"]},
  {key:"Planlama",accessKey:"Planlama",icon:"🗓️",modules:["action-center.html","kpi-reports.html","process-management.html"]},
  {key:"Tedarik Zinciri",accessKey:"Tedarik",icon:"🚚",modules:["supplier-management.html","action-center.html","kpi-reports.html"]},
  {key:"Depo",accessKey:"Depo",icon:"🏬",modules:["distribution.html","process-management.html","action-center.html"]},
  {key:"İnsan Kaynakları",accessKey:"İnsan Kaynakları",icon:"👥",modules:["training-management.html","competency-matrix.html","users.html"]},
  {key:"Laboratuvar",accessKey:"Laboratuvar",icon:"🧪",modules:["calibration-management.html","msa.html","standards-compliance.html"]},
  {key:"Bilgi Teknolojileri",accessKey:"Bilgi Teknolojileri",icon:"🖥️",modules:["users.html","security-continuity-center.html","legal-compliance.html"]},
  {key:"Yönetim",accessKey:"Yönetim",icon:"👑",modules:["management-review.html","kpi-reports.html","action-center.html","dashboard.html"]},
  {key:"Finans",accessKey:"Finans",icon:"🏛️",modules:["kpi-reports.html","approval.html","documents.html"]},
  {key:"Satış & Pazarlama",accessKey:"Satış Pazarlama",icon:"📈",modules:["customer-management.html","kpi-reports.html","capa.html"]},
  {key:"İdari İşler",accessKey:"İdari İşler",icon:"📁",modules:["company-assets-documents.html","documents.html","action-center.html"]},
  {key:"Bakım & Teknik",accessKey:"Bakım",icon:"🛠️",modules:["calibration-management.html","process-management.html","action-center.html"]}
];

const roleAccess={
  "Super Administrator":"ALL",
  "Kalite Admin":["Kalite","Yönetim","Ar-Ge","Üretim","Laboratuvar","Tedarik","İnsan Kaynakları"],
  "Departman Müdürü":"OWN_PLUS_MANAGEMENT",
  "Süreç Sahibi":"OWN_PLUS_QUALITY",
  "8D Lideri":["Kalite","Üretim","Tedarik","Laboratuvar"],
  "Denetçi":["Kalite","Yönetim","Tedarik","Üretim","Laboratuvar","İnsan Kaynakları","Bilgi Teknolojileri"],
  "Kullanıcı":"OWN_ONLY",
  "User":"OWN_ONLY"
};
function unique(arr){return [...new Set(arr.filter(Boolean))]}
function allowedDepartments(){
  if(isFullAccess())return departments.map(d=>d.accessKey);
  const role=session.role||"Kullanıcı";
  const dep=session.department||"Kalite";
  const rule=roleAccess[role]||"OWN_ONLY";
  if(rule==="ALL")return departments.map(d=>d.accessKey);
  if(rule==="OWN_ONLY")return [dep];
  if(rule==="OWN_PLUS_MANAGEMENT")return unique([dep,"Yönetim"]);
  if(rule==="OWN_PLUS_QUALITY")return unique([dep,"Kalite"]);
  return Array.isArray(rule)?rule:[dep];
}
function initials(name){return String(name||"DU").trim().split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase()}
function render(){
  const allowed=allowedDepartments();
  document.getElementById("userName").textContent=session.name;
  document.getElementById("userRole").textContent=session.role;
  document.getElementById("avatar").textContent=initials(session.name);
  const active=departments.filter(d=>allowed.includes(d.accessKey));
  const locked=departments.filter(d=>!allowed.includes(d.accessKey));
  const ordered=[...active.map(d=>({d,ok:true})),...locked.map(d=>({d,ok:false}))];
  document.getElementById("departmentGrid").innerHTML=ordered.map(x=>cardHTML(x.d,x.ok)).join("");
}
function cardHTML(d,ok){
  return `<article class="dept-card ${ok?"":"locked"}" onclick="openDepartment('${escapeJS(d.accessKey)}')">
    <div class="dept-top"><div class="dept-icon">${d.icon}</div><div class="state">${ok?"✓":"🔒"}</div></div>
    <h3>${escapeHTML(d.key)}</h3>
    <span class="badge">${ok?"Erişilebilir":"Yetkiniz Yok"}</span>
    <div class="open-dot">→</div>
  </article>`;
}
function openDepartment(accessKey){
  const allowed=allowedDepartments();
  const dept=departments.find(d=>d.accessKey===accessKey);
  if(!allowed.includes(accessKey)){showToast((dept?.key||accessKey)+" departmanı için yetkiniz bulunmamaktadır.");return;}
  localStorage.setItem("gdnl_selected_department",accessKey);
  localStorage.setItem("gdnl_selected_department_label",dept?.key||accessKey);
  localStorage.setItem("gdnl_department_modules",JSON.stringify(dept?.modules||[]));
  showToast((dept?.key||accessKey)+" çalışma alanı açılıyor...");
  setTimeout(()=>{window.location.href="dashboard.html"},450);
}
function logout(){
  localStorage.removeItem("gdnl_qdms_session");
  localStorage.removeItem("gdnl_selected_department");
  localStorage.removeItem("gdnl_selected_department_label");
  localStorage.removeItem("gdnl_department_modules");
  window.location.href="index.html";
}
function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.style.display="block";clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>t.style.display="none",2500)}
function escapeHTML(value){return String(value||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function escapeJS(value){return String(value||"").replaceAll("\\","\\\\").replaceAll("'","\\'")}
render();
</script>
</body>
</html>
