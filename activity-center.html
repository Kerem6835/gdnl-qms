<!DOCTYPE html>
<html lang="tr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GDNL EQMS | Aktivite Merkezi</title><style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Arial,sans-serif}body{background:#f4f9ff;color:#172033;overflow-x:hidden}.main{max-width:1440px;margin:0 auto;padding:24px}.topbar,.panel{background:rgba(255,255,255,.94);border:1px solid #dfe9f5;border-radius:22px;box-shadow:0 16px 42px rgba(7,27,52,.07)}.topbar{min-height:64px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-size:24px;font-weight:950;color:#071b34;text-decoration:none}.brand span{color:#35a852}.panel{padding:18px;overflow:auto}.hero h1{font-size:34px;font-weight:950}.hero p{margin:8px 0 18px;color:#617086;font-weight:800}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #edf2f7;text-align:left;font-size:13px}th{color:#617086;background:#f8fbff}.empty{padding:24px;text-align:center;color:#64748b;font-weight:900}</style></head>
<body><main class="main"><div class="topbar"><a class="brand" href="dashboard.html">GDNL <span>EQMS</span></a><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><a href="mailbox.html" style="text-decoration:none;background:#dcfce7;color:#15803d;border-radius:12px;padding:9px 12px;font-weight:950">📨 Mesaj Merkezi</a><div>👤 <span id="userName">Oturum Kullanıcısı</span></div></div></div><section class="hero"><h1>Aktivite Merkezi</h1><p>Kim, ne yaptı, ne zaman yaptı kayıtları.</p></section><section class="panel"><div id="table" class="empty">Yükleniyor...</div></section></main><script src="assets/js/config/api-client.js"></script><script>
const api=window.GDNL_API;function val(x,...k){for(const key of k){if(x?.[key])return x[key]}return""}async function boot(){let rows=[];try{rows=api.asArray(await api.get("/activity-feed"))}catch(e){rows=[]}if(!rows.length){table.innerHTML='<div class="empty">Aktivite kaydı bulunamadı.</div>';return}table.innerHTML='<table><thead><tr><th>Kişi</th><th>İşlem</th><th>Modül</th><th>Kayıt</th><th>Tarih</th></tr></thead><tbody>'+rows.slice(0,200).map(r=>`<tr><td>${val(r,"user_name","user","created_by")||"Oturum Kullanıcısı"}</td><td>${val(r,"action","title","activity_type")||"-"}</td><td>${val(r,"module")||"-"}</td><td>${val(r,"record_no","related_id")||"-"}</td><td>${val(r,"created_at","date")||"-"}</td></tr>`).join("")+'</tbody></table>'}boot();
</script><script src="assets/js/ui/maturity-widgets.js"></script>
<script src="assets/js/ui/enterprise-tools.js"></script>
</body></html>
