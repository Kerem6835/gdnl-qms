<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GDNL EQMS | Global Arama</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Arial,sans-serif}body{background:#f4f9ff;color:#172033;min-height:100vh;overflow-x:hidden}.main{max-width:1440px;margin:0 auto;padding:24px}.topbar,.panel{background:rgba(255,255,255,.94);border:1px solid #dfe9f5;border-radius:22px;box-shadow:0 16px 42px rgba(7,27,52,.07)}.topbar{min-height:64px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.brand{font-size:24px;font-weight:950;color:#071b34;text-decoration:none}.brand span{color:#35a852}.search{height:44px;border:1px solid #d8e4ef;border-radius:12px;padding:0 12px;font-weight:800;flex:1;min-width:220px}.user{font-weight:900}.hero h1{font-size:34px;font-weight:950}.hero p{margin:8px 0 18px;color:#617086;font-weight:800}.panel{padding:18px}.result{border:1px solid #edf2f7;border-radius:16px;padding:14px;margin-bottom:10px;background:#fff}.result b{color:#071b34}.result small{display:block;margin-top:5px;color:#617086;font-weight:800}.tag{display:inline-flex;border-radius:999px;background:#e8f7ee;color:#1f7d3d;padding:5px 9px;font-size:11px;font-weight:950;margin-bottom:8px}.empty{padding:24px;text-align:center;color:#64748b;font-weight:900}@media(max-width:720px){.topbar{flex-wrap:wrap}.search{width:100%;flex:auto}.main{padding:16px}}
</style>
</head>
<body><main class="main"><div class="topbar"><a class="brand" href="dashboard.html">GDNL <span>EQMS</span></a><div class="user" style="gap:10px;flex-wrap:wrap"><a href="mailbox.html" style="text-decoration:none;background:#dcfce7;color:#15803d;border-radius:12px;padding:9px 12px;font-weight:950">📨 Mesaj Merkezi</a>👤 <span id="userName">Kullanıcı</span></div></div><section class="hero"><h1>Global Arama</h1><p>Kullanıcı, doküman, risk, CAPA, aksiyon, eğitim ve denetim kayıtlarında arama yap.</p><input id="q" class="search" placeholder="Ara..."></section><section class="panel"><div id="results" class="empty">Arama için metin yaz.</div></section></main><script src="assets/js/config/api-client.js"></script>
<script src="assets/js/ui/user-autocomplete.js?v=quality-users-2"></script><script>
const api=window.GDNL_API;const endpoints=[["Kullanıcı","/users"],["Doküman","/documents"],["Risk","/risks"],["CAPA","/capas"],["Aksiyon","/actions"],["Eğitim","/trainings"],["Denetim","/audits"]];let cache=[];
function text(x){return JSON.stringify(x||{}).toLowerCase()}function title(x){return x.fullname||x.username||x.document_name||x.documentName||x.title||x.name||x.riskNo||x.risk_no||x.capaNo||x.capa_no||x.auditNo||x.audit_no||x.trainingNo||x.training_no||x.id||"Kayıt"}
async function load(){const chunks=await Promise.all(endpoints.map(async e=>{try{return api.asArray(await api.get(e[1])).map(x=>({module:e[0],item:x}))}catch(err){return[]}}));cache=chunks.flat()}
function render(){const s=q.value.trim().toLowerCase();if(!s){results.innerHTML='<div class="empty">Arama için metin yaz.</div>';return}const rows=cache.filter(r=>text(r.item).includes(s)).slice(0,80);results.innerHTML=rows.length?rows.map(r=>`<div class="result"><span class="tag">${r.module}</span><b>${title(r.item)}</b><small>${JSON.stringify(r.item).slice(0,240)}</small></div>`).join(""):'<div class="empty">Sonuç bulunamadı.</div>'}
q.addEventListener("input",render);load().then(render);
</script><script src="assets/js/ui/maturity-widgets.js"></script>
<script src="assets/js/ui/enterprise-tools.js"></script>
</body></html>
