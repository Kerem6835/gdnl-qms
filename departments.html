<!DOCTYPE html>
<html lang="tr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GDNL EQMS | Departmanlar</title><style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Arial,sans-serif}body{background:#f4f9ff;color:#172033;overflow-x:hidden}.main{max-width:1440px;margin:0 auto;padding:24px}.topbar,.panel{background:rgba(255,255,255,.94);border:1px solid #dfe9f5;border-radius:22px;box-shadow:0 16px 42px rgba(7,27,52,.07)}.topbar{min-height:64px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-size:24px;font-weight:950;color:#071b34;text-decoration:none}.brand span{color:#35a852}.panel{padding:18px;overflow:auto}.hero h1{font-size:34px;font-weight:950}.hero p{margin:8px 0 18px;color:#617086;font-weight:800}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #edf2f7;text-align:left;font-size:13px}th{color:#617086;background:#f8fbff}.empty{padding:24px;text-align:center;color:#64748b;font-weight:900}</style></head>
<body><main class="main"><div class="topbar"><a class="brand" href="dashboard.html">GDNL <span>EQMS</span></a><div>👤 <span id="userName">Kullanıcı</span></div></div><section class="hero"><h1>Departmanlar</h1><p>Departman listesi ve çoklu rol/yetki görünümü.</p></section><section class="panel"><div id="table" class="empty">Yükleniyor...</div></section></main><script src="assets/js/config/api-client.js"></script><script>
const api=window.GDNL_API;async function boot(){let deps=[],users=[];try{deps=await api.loadDepartments();users=await api.loadUsers()}catch(e){}if(!deps.length){table.innerHTML='<div class="empty">Departman bulunamadı.</div>';return}table.innerHTML='<table><thead><tr><th>Departman</th><th>Kullanıcı</th><th>Roller</th><th>Durum</th></tr></thead><tbody>'+deps.map(d=>{const name=d.department_name;const members=users.filter(u=>u.department===name);const roles=[...new Set(members.map(u=>u.role).filter(Boolean))].join(", ");return`<tr><td>${name}</td><td>${members.length}</td><td>${roles||"-"}</td><td>${d.status||"Aktif"}</td></tr>`}).join("")+'</tbody></table>'}boot();
</script><script src="assets/js/ui/maturity-widgets.js"></script>
<script src="assets/js/ui/enterprise-tools.js"></script>
</body></html>
