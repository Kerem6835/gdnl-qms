<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GDNL EMS | 3D Hero Visual</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#07162c;
  --blue:#1677ff;
  --green:#22c55e;
  --cyan:#7dd3fc;
  --line:#dfeaf7;
  --soft:#eef7ff;
  --glass:rgba(255,255,255,.58);
  --shadow:0 32px 90px rgba(17,45,85,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:Inter,Arial,sans-serif;background:transparent}
body{display:grid;place-items:center}
.gdnl-visual{
  position:relative;
  width:min(940px,96vw);
  aspect-ratio:934/360;
  overflow:visible;
  filter:drop-shadow(0 24px 45px rgba(19,58,110,.10));
}
.platform-shadow{
  position:absolute;
  left:6%;right:5%;bottom:4%;height:31%;
  border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(117,184,255,.22),rgba(56,189,248,.10) 42%,rgba(255,255,255,0) 72%);
  filter:blur(10px);
}
.platform{
  position:absolute;
  left:0;right:0;bottom:2%;height:54%;
  border-radius:50% 50% 43% 42%/55% 55% 45% 45%;
  background:
    radial-gradient(ellipse at 50% 30%,rgba(255,255,255,.98) 0 38%,rgba(235,249,255,.88) 55%,rgba(214,236,255,.55) 75%,rgba(255,255,255,0) 100%),
    linear-gradient(90deg,rgba(225,255,247,.82),rgba(236,246,255,.95),rgba(229,242,255,.82));
  border:1px solid rgba(187,218,248,.72);
  box-shadow:inset 0 0 44px rgba(255,255,255,.96),inset 0 -18px 30px rgba(123,188,255,.16),0 26px 58px rgba(22,78,140,.12);
}
.platform:before{
  content:"";
  position:absolute;inset:13% 13% 15% 12%;
  border-radius:50%;
  border:1px solid rgba(142,198,241,.38);
  background:radial-gradient(ellipse at center,rgba(255,255,255,.94),rgba(234,247,255,.58) 55%,rgba(255,255,255,0) 78%);
}
.platform:after{
  content:"";
  position:absolute;left:27%;right:28%;bottom:23%;height:18%;
  border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(0,112,255,.18),rgba(255,255,255,0) 70%);
  filter:blur(4px);
}
.back-wall{
  position:absolute;
  left:12%;right:12%;top:7%;height:63%;
  border-radius:52% 52% 20px 20px/80% 80% 20px 20px;
  background:
    linear-gradient(90deg,rgba(230,255,249,.32),rgba(239,248,255,.64),rgba(237,244,255,.32));
  border-top:1px solid rgba(164,212,250,.55);
  border-left:1px solid rgba(164,212,250,.20);
  border-right:1px solid rgba(164,212,250,.20);
  box-shadow:inset 0 20px 50px rgba(255,255,255,.85);
}
.dashed-orbit{
  position:absolute;
  left:18%;right:18%;top:31%;height:34%;
  border-radius:50%;
  border:1px dashed rgba(61,136,214,.23);
  transform:rotate(-5deg);
}
.center-stage{
  position:absolute;
  left:36%;right:36%;top:48%;height:23%;
  border-radius:50%;
  background:linear-gradient(180deg,#fff,#e8f4ff);
  border:1px solid rgba(198,225,250,.8);
  box-shadow:0 20px 38px rgba(34,99,164,.16), inset 0 8px 18px rgba(255,255,255,.9);
}
.center-stage:before{
  content:"";
  position:absolute;left:4%;right:4%;top:-44%;height:68%;
  border-radius:50%;
  background:linear-gradient(180deg,#fff,#ecf6ff);
  border:1px solid rgba(192,221,249,.78);
  box-shadow:0 10px 22px rgba(39,100,165,.12);
}
.logo-g{
  position:absolute;
  left:50%;top:17%;
  width:17.5%;aspect-ratio:1;
  transform:translateX(-50%);
  filter:drop-shadow(0 22px 24px rgba(16,71,133,.23));
}
.logo-g .hex-a,.logo-g .hex-b{position:absolute;inset:0;clip-path:polygon(50% 0,91% 24%,91% 72%,50% 100%,9% 72%,9% 24%)}
.logo-g .hex-a{background:linear-gradient(135deg,#13b86a 0%,#21c862 44%,#1476ff 100%)}
.logo-g .hex-b{inset:24%;background:#fff;clip-path:polygon(50% 0,88% 22%,88% 44%,53% 44%,53% 58%,75% 58%,75% 74%,50% 88%,17% 69%,17% 31%)}
.logo-g .glow{position:absolute;inset:-20%;border-radius:50%;background:radial-gradient(circle,rgba(43,210,104,.22),rgba(22,119,255,.08),transparent 70%);z-index:-1;filter:blur(10px)}
.glass-card{
  position:absolute;
  width:15.5%;height:37%;
  border-radius:16px;
  background:linear-gradient(145deg,rgba(255,255,255,.58),rgba(225,242,255,.35));
  border:1px solid rgba(183,219,250,.72);
  box-shadow:0 22px 38px rgba(32,96,166,.08), inset 0 0 20px rgba(255,255,255,.75);
  backdrop-filter:blur(8px);
}
.card-left-1{left:8.5%;top:28%;transform:skewY(-8deg) rotateY(12deg)}
.card-left-2{left:25%;top:4%;height:40%;transform:skewY(-3deg)}
.card-right-1{right:23%;top:9%;height:39%;transform:skewY(3deg)}
.card-right-2{right:7%;top:29%;transform:skewY(8deg) rotateY(-12deg)}
.icon-bars,.icon-shield,.icon-doc,.icon-user{position:absolute;inset:0;display:grid;place-items:center}
.icon-bars span{display:block;width:8%;border-radius:99px;background:linear-gradient(180deg,#77dfff,#25c55e);opacity:.85;box-shadow:0 8px 18px rgba(37,197,94,.18)}
.icon-bars span:nth-child(1){height:28%;transform:translate(-130%,28%)}
.icon-bars span:nth-child(2){height:46%;transform:translate(0,12%)}
.icon-bars span:nth-child(3){height:65%;transform:translate(130%,2%)}
.icon-doc:before{content:"";width:34%;height:48%;border-radius:8px;background:linear-gradient(180deg,#d7efff,#8bd0ff);box-shadow:inset 0 0 12px rgba(255,255,255,.8)}
.icon-doc:after{content:"";position:absolute;width:20%;height:2.7%;border-radius:9px;background:#7bbdf4;top:47%;left:43%;box-shadow:0 12px 0 #9bd7ff,0 24px 0 #b7e8ff}
.icon-shield:before{content:"";width:35%;height:43%;clip-path:polygon(50% 0,90% 16%,80% 72%,50% 100%,20% 72%,10% 16%);background:linear-gradient(160deg,#1a7dff,#5be676);box-shadow:0 12px 22px rgba(22,119,255,.22)}
.icon-shield:after{content:"";position:absolute;width:16%;height:9%;border-left:3px solid #fff;border-bottom:3px solid #fff;transform:rotate(-45deg);top:47%;left:43%}
.icon-user:before{content:"";position:absolute;width:20%;height:20%;border-radius:50%;background:linear-gradient(180deg,#1976ff,#64e779);top:29%;left:40%}
.icon-user:after{content:"";position:absolute;width:43%;height:23%;border-radius:50% 50% 32% 32%;background:linear-gradient(180deg,#1976ff,#8eeeff);top:52%;left:28%;opacity:.85}
.dot{position:absolute;width:18px;height:18px;border-radius:50%;box-shadow:0 8px 18px rgba(0,0,0,.14)}
.d1{left:1%;top:41%;background:linear-gradient(135deg,#18a0fb,#8cf8ff)}
.d2{left:18%;top:4%;background:linear-gradient(135deg,#6ee67a,#2bbb62)}
.d3{left:28%;bottom:15%;background:linear-gradient(135deg,#42d57c,#0cae5c)}
.d4{right:18%;bottom:17%;background:linear-gradient(135deg,#d68aff,#7c3cff)}
.d5{right:0;top:38%;background:linear-gradient(135deg,#ffc66d,#ff8a00)}
.soft-line{position:absolute;height:1px;background:linear-gradient(90deg,transparent,rgba(52,142,232,.32),transparent)}
.l1{left:14%;right:16%;top:58%;transform:rotate(-5deg)}
.l2{left:23%;right:22%;top:37%;transform:rotate(6deg)}
@media(max-width:680px){.gdnl-visual{width:98vw}.dot{width:12px;height:12px}.glass-card{border-radius:10px}}
</style>
</head>
<body>
  <div class="gdnl-visual" aria-label="GDNL EMS 3D hero visual">
    <div class="platform-shadow"></div>
    <div class="back-wall"></div>
    <div class="dashed-orbit"></div>
    <div class="soft-line l1"></div>
    <div class="soft-line l2"></div>

    <div class="glass-card card-left-1"><div class="icon-bars"><span></span><span></span><span></span></div></div>
    <div class="glass-card card-left-2"><div class="icon-shield"></div></div>
    <div class="glass-card card-right-1"><div class="icon-bars"><span></span><span></span><span></span></div></div>
    <div class="glass-card card-right-2"><div class="icon-user"></div></div>

    <div class="platform"></div>
    <div class="center-stage"></div>
    <div class="logo-g"><div class="glow"></div><div class="hex-a"></div><div class="hex-b"></div></div>

    <div class="dot d1"></div>
    <div class="dot d2"></div>
    <div class="dot d3"></div>
    <div class="dot d4"></div>
    <div class="dot d5"></div>
  </div>
</body>
</html>
