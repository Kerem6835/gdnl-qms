<!DOCTYPE html>
<html lang="tr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GDNL EQMS | Bakım Yönetimi</title><style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Arial,sans-serif}body{background:#f4f9ff;color:#172033;overflow-x:hidden}.main{max-width:1440px;margin:0 auto;padding:24px}.topbar,.panel,.card{background:rgba(255,255,255,.94);border:1px solid #dfe9f5;border-radius:22px;box-shadow:0 16px 42px rgba(7,27,52,.07)}.topbar{min-height:64px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-size:24px;font-weight:950;color:#071b34;text-decoration:none}.brand span{color:#35a852}.hero h1{font-size:34px;font-weight:950}.hero p{margin:8px 0 18px;color:#617086;font-weight:800}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}.card{padding:18px}.card small{font-weight:950;color:#617086}.card h2{font-size:34px;color:#1f7d3d}.panel{padding:18px;overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #edf2f7;text-align:left;font-size:13px}th{color:#617086;background:#f8fbff}.empty{padding:24px;text-align:center;color:#64748b;font-weight:900}</style></head>
<body><main class="main"><div class="topbar"><a class="brand" href="dashboard.html">GDNL <span>EQMS</span></a><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><a href="mailbox.html" style="text-decoration:none;background:#dcfce7;color:#15803d;border-radius:12px;padding:9px 12px;font-weight:950">📨 Mesaj Merkezi</a><div>👤 <span id="userName">Kullanıcı</span></div></div></div><section class="hero"><h1>Bakım Yönetimi</h1><p>Periyodik bakım, bakım planı, sorumlu ve kanıt dosyaları görünümü.</p></section><section class="cards"><div class="card"><small>Bakım Kaydı</small><h2 id="total">0</h2></div><div class="card"><small>Açık</small><h2 id="open">0</h2></div><div class="card"><small>Geciken</small><h2 id="late">0</h2></div></section><section class="panel"><div id="table" class="empty">Yükleniyor...</div></section></main><script src="assets/js/config/api-client.js"></script>
<script src="assets/js/ui/user-autocomplete.js?v=quality-users-5"></script><script>
const api=window.GDNL_API;function isOpen(x){return !/kapalı|tamamlandı|iptal/i.test(String(x.status||x.maintenanceStatus||""))}function isLate(x){const d=x.due_date||x.dueDate||x.plannedDate;if(!d||!isOpen(x))return false;return new Date(d)<new Date()}async function boot(){let rows=[];try{rows=api.asArray(await api.get("/maintenance"))}catch(e){rows=[]}total.textContent=rows.length;open.textContent=rows.filter(isOpen).length;late.textContent=rows.filter(isLate).length;if(!rows.length){table.innerHTML='<div class="empty">Bakım kaydı bulunamadı.</div>';return}table.innerHTML='<table><thead><tr><th>Kayıt</th><th>Ekipman</th><th>Sorumlu</th><th>Plan</th><th>Durum</th></tr></thead><tbody>'+rows.map(r=>`<tr><td>${r.record_no||r.maintenanceNo||r.id||"-"}</td><td>${r.equipment||r.asset_name||r.title||"-"}</td><td>${r.owner_name||r.owner||r.assigned_to||"-"}</td><td>${r.due_date||r.plannedDate||"-"}</td><td>${r.status||r.maintenanceStatus||"-"}</td></tr>`).join("")+'</tbody></table>'}boot();
</script><script src="assets/js/ui/maturity-widgets.js"></script>
</body></html>
