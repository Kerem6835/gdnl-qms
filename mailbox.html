<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GDNL EQMS | Mailbox</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Arial,sans-serif}body{background:#f4f9ff;color:#172033;min-height:100vh;overflow-x:hidden}.main{max-width:1440px;margin:0 auto;padding:24px}.topbar,.panel,.card{background:rgba(255,255,255,.94);border:1px solid #dfe9f5;border-radius:22px;box-shadow:0 16px 42px rgba(7,27,52,.07)}.topbar{min-height:64px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.brand{font-size:24px;font-weight:950;color:#071b34;text-decoration:none}.brand span{color:#35a852}.search{height:40px;border:1px solid #d8e4ef;border-radius:12px;padding:0 12px;font-weight:800;min-width:260px}.user{display:inline-flex;gap:7px;font-weight:900}.hero h1{font-size:34px;font-weight:950;color:#071b34}.hero p{margin:8px 0 18px;color:#617086;font-weight:800}.grid{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px}.panel{padding:18px;overflow:auto}.folder{width:100%;height:42px;border:none;border-radius:13px;background:#f8fbff;color:#536176;font-weight:950;text-align:left;padding:0 12px;margin-bottom:8px;cursor:pointer}.folder.active{background:#e8f7ee;color:#1f7d3d}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:16px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:950;color:#617086}.field input,.field textarea{width:100%;border:1px solid #d8e4ef;border-radius:13px;padding:10px 12px;font-weight:800}.field input{height:42px}.field textarea{min-height:92px;resize:vertical}.btn{height:40px;border:none;border-radius:12px;padding:0 13px;font-weight:950;cursor:pointer;background:linear-gradient(135deg,#1f8f43,#35a852,#62d46f);color:#fff}.btn.secondary{background:#dcfce7;color:#15803d}.btn.danger{background:#fee2e2;color:#991b1b}.actions{display:flex;gap:10px;flex-wrap:wrap}.message{border:1px solid #edf2f7;border-radius:16px;padding:14px;margin-bottom:10px;background:#fff}.message b{display:block;color:#071b34}.message small{display:block;margin-top:5px;color:#617086;font-weight:800}.chip{display:inline-flex;border-radius:999px;background:#e8f7ee;color:#1f7d3d;padding:5px 9px;font-size:11px;font-weight:950;margin:6px 6px 0 0}.empty{padding:24px;text-align:center;color:#64748b;font-weight:900}.suggest{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid #dfe9f5;border-radius:14px;box-shadow:0 18px 45px rgba(7,27,52,.12);display:none;z-index:10;max-height:220px;overflow:auto}.suggest div{padding:10px 12px;border-bottom:1px solid #edf2f7;cursor:pointer;font-size:12px;font-weight:900}.recipient-wrap{position:relative}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}@media(max-width:820px){.grid{grid-template-columns:1fr}.topbar{flex-wrap:wrap}.search{width:100%;min-width:0}.main{padding:16px}}
</style>
</head>
<body>
<main class="main">
<div class="topbar"><a class="brand" href="dashboard.html">GDNL <span>EQMS</span></a><input id="searchBox" class="search" placeholder="Ara..."><div class="user">👤 <span id="userName">Kullanıcı</span></div></div>
<section class="hero"><h1>Mailbox</h1><p>Sistem içi mesajlaşma, çoklu alıcı, R2 dosya eki, taslak ve okundu bilgisi.</p></section>
<section class="grid">
<aside class="panel">
<button class="folder active" data-folder="inbox">Gelen Kutusu</button>
<button class="folder" data-folder="sent">Giden Kutusu</button>
<button class="folder" data-folder="draft">Taslaklar</button>
<button class="folder" data-folder="trash">Çöp Kutusu</button>
</aside>
<section class="panel">
<div class="form">
<div class="field full recipient-wrap"><label>Alıcılar</label><input id="recipientInput" autocomplete="off" placeholder="Kullanıcı ara ve seç"><div id="suggestions" class="suggest"></div><div id="recipientChips" class="chips"></div></div>
<div class="field full"><label>Konu</label><input id="subject"></div>
<div class="field full"><label>Mesaj</label><textarea id="body"></textarea></div>
<div class="field full"><label>R2 Dosya Eki</label><input id="attachment" type="file"></div>
</div>
<div class="actions"><button class="btn" onclick="sendMessage()">Gönder</button><button class="btn secondary" onclick="saveDraft()">Taslak Kaydet</button><button class="btn danger" onclick="clearCompose()">Temizle</button></div>
</section>
</section>
<section class="panel" style="margin-top:16px"><div id="messageList" class="empty">Yükleniyor...</div></section>
</main>
<script src="assets/js/config/api-client.js"></script>
<script>
const api=window.GDNL_API;let users=[],messages=[],recipients=[],folder="inbox",attachmentFile=null;
const currentUser=()=>window.GDNL_CURRENT_USER||{};
const userNameOf=u=>u.fullname||u.username||"Kullanıcı";
function normalizeMessage(m){return{...m,id:m.id||m.message_id||("MSG-"+Date.now()),folder:m.folder||m.status_folder||"inbox",subject:m.subject||"",body:m.body||m.message||"",recipients:Array.isArray(m.recipients)?m.recipients:[],from:m.from||m.sender_name||m.created_by||"",is_read:Boolean(m.is_read),attachment:m.attachment||m.file||null,created_at:m.created_at||new Date().toISOString()}}
async function load(){try{users=await api.loadUsers()}catch(e){users=[]}try{messages=api.asArray(await api.get("/messages")).map(normalizeMessage)}catch(e){messages=[]}render()}
function render(){const q=searchBox.value.toLowerCase();const rows=messages.filter(m=>m.folder===folder&&`${m.subject} ${m.body} ${m.from}`.toLowerCase().includes(q));messageList.innerHTML=rows.length?rows.map(m=>`<div class="message"><b>${m.is_read?"":"● "}${m.subject||"(Konu yok)"}</b><small>${m.from||"Kullanıcı"} · ${m.created_at}</small><p>${m.body||""}</p>${(m.recipients||[]).map(r=>`<span class="chip">${r.fullname||r.username||"Kullanıcı"}</span>`).join("")}${m.attachment?`<span class="chip">Ek: ${m.attachment.fileName||m.attachment.file_name||"Dosya"}</span>`:""}<div class="actions" style="margin-top:10px"><button class="btn secondary" onclick="markRead('${m.id}')">Okundu</button><button class="btn danger" onclick="moveTrash('${m.id}')">Çöp</button></div></div>`).join(""):'<div class="empty">Mesaj bulunamadı.</div>'}
function renderRecipients(){recipientChips.innerHTML=recipients.map((u,i)=>`<span class="chip">${userNameOf(u)} <button onclick="recipients.splice(${i},1);renderRecipients()" style="border:none;background:transparent;color:#991b1b;font-weight:950">×</button></span>`).join("")}
recipientInput.addEventListener("input",()=>{const q=recipientInput.value.toLowerCase();const found=users.filter(u=>`${u.fullname} ${u.username} ${u.email} ${u.department}`.toLowerCase().includes(q)).slice(0,10);suggestions.innerHTML=found.map((u,i)=>`<div data-i="${i}">${userNameOf(u)}<br><small>${u.email||""} · ${u.department||""}</small></div>`).join("");suggestions.style.display=found.length?"block":"none";suggestions.querySelectorAll("[data-i]").forEach(el=>el.onclick=()=>{const u=found[Number(el.dataset.i)];if(!recipients.some(r=>String(r.id)===String(u.id)))recipients.push(u);recipientInput.value="";suggestions.style.display="none";renderRecipients()})});
attachment.addEventListener("change",e=>{attachmentFile=e.target.files[0]||null});
async function uploadAttachment(record){if(!attachmentFile)return null;try{return await api.uploadToR2(attachmentFile,{module:"MAILBOX",related_id:record,uploaded_by:userNameOf(currentUser())})}catch(e){api.showToast("R2 ek yükleme başarısız");return null}}
async function save(folderName){const id="MSG-"+Date.now();const file=await uploadAttachment(id);const payload={id,folder:folderName,subject:subject.value.trim(),body:body.value.trim(),recipients:recipients.map(api.normalizeUser),from:userNameOf(currentUser()),from_id:currentUser().id||"",is_read:false,attachment:file,created_at:new Date().toISOString()};try{await api.post("/messages",payload)}catch(e){}messages.unshift(normalizeMessage(payload));clearCompose();render();api.showToast(folderName==="draft"?"Taslak kaydedildi":"Mesaj gönderildi")}
function sendMessage(){if(!recipients.length)return api.showToast("Alıcı seç");save("sent")}
function saveDraft(){save("draft")}
function clearCompose(){recipients=[];subject.value="";body.value="";attachment.value="";attachmentFile=null;renderRecipients()}
function markRead(id){const m=messages.find(x=>x.id===id);if(m){m.is_read=true;api.put("/messages/"+encodeURIComponent(id)+"/read",m).catch(()=>{});render()}}
function moveTrash(id){const m=messages.find(x=>x.id===id);if(m){m.folder="trash";api.put("/messages/"+encodeURIComponent(id),m).catch(()=>{});render()}}
document.querySelectorAll(".folder").forEach(btn=>btn.onclick=()=>{document.querySelectorAll(".folder").forEach(b=>b.classList.remove("active"));btn.classList.add("active");folder=btn.dataset.folder;render()});
searchBox.addEventListener("input",render);load();
</script>
<script src="assets/js/ui/enterprise-tools.js"></script>
</body>
</html>
