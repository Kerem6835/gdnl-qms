<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GDNL EOS | Mesaj Merkezi</title>
<style>
:root{
  --navy:#061b36;
  --text:#10223d;
  --muted:#61718a;
  --line:#dfeaf6;
  --soft:#f4f9ff;
  --panel:#ffffff;
  --green:#20b957;
  --green2:#16a34a;
  --blue:#2563eb;
  --red:#dc2626;
  --orange:#f59e0b;
  --shadow:0 18px 46px rgba(7,27,52,.08);
  --radius:22px;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Arial,sans-serif}
body{
  min-height:100vh;
  background:linear-gradient(135deg,#f7fbff 0%,#eef7ff 48%,#f8fbff 100%);
  color:var(--text);
  overflow-x:hidden;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 20% 5%,rgba(32,185,87,.08),transparent 28%),
    radial-gradient(circle at 78% 8%,rgba(37,99,235,.08),transparent 31%),
    linear-gradient(135deg,rgba(37,99,235,.025) 25%,transparent 25%) 0 0/28px 28px;
  opacity:.9;
}
a{text-decoration:none;color:inherit}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.main{
  width:min(1760px,96%);
  margin:0 auto;
  padding:18px 0 28px;
  position:relative;
}
.topbar{
  min-height:92px;
  background:rgba(255,255,255,.94);
  border:1px solid var(--line);
  border-radius:28px;
  box-shadow:var(--shadow);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:22px;
  padding:16px 20px;
  backdrop-filter:blur(16px);
}
.brand{
  display:flex;
  align-items:center;
  gap:14px;
  min-width:250px;
}
.logo-mark{
  width:64px;
  height:64px;
  border-radius:18px;
  background:transparent;
  display:grid;
  place-items:center;
  box-shadow:none;
  overflow:hidden;
}
.logo-mark img{width:64px;height:64px;object-fit:contain;display:block}
.logo-text strong{
  display:block;
  color:#071b34;
  font-size:29px;
  line-height:1;
  font-weight:950;
  letter-spacing:-1.4px;
}
.logo-text strong span{color:var(--green)}
.logo-text small{
  display:block;
  margin-top:7px;
  color:#5a6a83;
  font-weight:850;
  font-size:13px;
}
.global-search{
  flex:1;
  max-width:640px;
  display:flex;
  align-items:center;
  gap:10px;
}
.search{
  height:48px;
  width:100%;
  border:1px solid #d8e5f2;
  border-radius:15px;
  background:#fff;
  padding:0 16px;
  font-weight:850;
  color:#0f1b2f;
  outline:none;
}
.search:focus{border-color:#91d9a9;box-shadow:0 0 0 5px rgba(32,185,87,.12)}
.search-btn{
  height:48px;
  min-width:76px;
  border:1px solid #d8e5f2;
  border-radius:15px;
  background:#fff;
  color:#071b34;
  font-weight:950;
}
.search-btn:hover{border-color:#99deb0;color:var(--green2)}
.topbar-actions{
  display:flex;
  align-items:center;
  gap:11px;
}
.nav-btn,.icon-btn,.user-btn,.logout-btn{
  height:48px;
  border:1px solid #d8e5f2;
  border-radius:15px;
  background:#fff;
  color:#0f1b2f;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  padding:0 15px;
  font-weight:950;
  font-size:13px;
  white-space:nowrap;
  position:relative;
}
.nav-btn{
  min-width:178px;
  background:linear-gradient(135deg,#0b7fe8 0%,#1396c8 46%,#21bd59 100%);
  color:#fff;
  border-color:transparent;
  box-shadow:0 14px 28px rgba(19,150,200,.18);
}
.icon-btn{width:48px;padding:0;font-size:18px}
.user-btn{background:linear-gradient(135deg,#eef6ff,#fbfdff);min-width:165px}
.logout-btn{background:#fff6f6;color:#b42318;border-color:#ffd2d2;min-width:142px}
.unread-badge,.notify-badge{
  position:absolute;
  top:-8px;
  right:-7px;
  min-width:22px;
  height:22px;
  padding:0 6px;
  border-radius:999px;
  background:#ef4444;
  color:#fff;
  font-size:11px;
  font-weight:950;
  display:none;
  align-items:center;
  justify-content:center;
  border:2px solid #fff;
}
.unread-badge.is-visible,.notify-badge.is-visible{display:flex}
.hero{
  margin:22px 0 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}
.hero h1{
  font-size:36px;
  font-weight:950;
  color:#071b34;
  letter-spacing:-1.2px;
}
.hero .meta{
  margin-top:7px;
  color:#61718a;
  font-weight:850;
}
.primary-btn{
  height:48px;
  border:none;
  border-radius:15px;
  padding:0 20px;
  background:linear-gradient(135deg,#0b7fe8 0%,#1396c8 46%,#21bd59 100%);
  color:#fff;
  font-weight:950;
  box-shadow:0 14px 28px rgba(19,150,200,.18);
}
.mail-shell{
  display:grid;
  grid-template-columns:260px minmax(430px,.95fr) minmax(520px,1.25fr);
  gap:16px;
  align-items:start;
}
.panel{
  background:rgba(255,255,255,.94);
  border:1px solid var(--line);
  border-radius:24px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(16px);
}
.sidebar{
  padding:15px;
  min-height:680px;
}
.folder{
  width:100%;
  min-height:50px;
  border:none;
  border-radius:16px;
  background:transparent;
  color:#50627d;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:0 13px;
  margin-bottom:8px;
  font-weight:950;
  text-align:left;
}
.folder:hover{background:#f3f8ff}
.folder.active{
  background:linear-gradient(135deg,#eaf5ff 0%,#e9fbf0 100%);
  color:#0f7f4c;
  box-shadow:inset 4px 0 0 #21bd59;
}
.folder-left{
  display:flex;
  align-items:center;
  gap:10px;
}
.folder-ico{
  width:34px;
  height:34px;
  border-radius:12px;
  background:#f0f7ff;
  display:grid;
  place-items:center;
}
.folder.active .folder-ico{background:linear-gradient(135deg,#0b7fe8 0%,#1396c8 46%,#21bd59 100%);color:#fff}
.folder .count{
  min-width:24px;
  height:24px;
  padding:0 7px;
  border-radius:999px;
  display:none;
  align-items:center;
  justify-content:center;
  background:#ef4444;
  color:#fff;
  font-size:12px;
  font-weight:950;
}
.folder .count.is-visible{display:flex}
.compose-left{
  width:100%;
  height:50px;
  border:none;
  border-radius:16px;
  background:linear-gradient(135deg,#0b7fe8 0%,#1396c8 46%,#21bd59 100%);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  font-weight:950;
  margin:12px 0 18px;
}
.sidebar-note{
  margin-top:18px;
  padding:14px;
  border:1px solid #e3eef9;
  border-radius:18px;
  background:linear-gradient(135deg,#f8fbff,#eef7ff);
  color:#64748b;
  font-size:12px;
  font-weight:850;
  line-height:1.45;
}
.mail-list-panel{
  min-height:680px;
  overflow:hidden;
}
.list-head{
  padding:16px 16px 12px;
  border-bottom:1px solid #edf3fa;
}
.list-title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:13px;
}
.list-title-row h2{
  color:#071b34;
  font-size:20px;
  font-weight:950;
}
.status-pill{
  padding:7px 10px;
  border-radius:999px;
  background:linear-gradient(135deg,#0b7fe8 0%,#1396c8 46%,#21bd59 100%);
  color:#fff;
  font-size:12px;
  font-weight:950;
}
.filters{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}
.filters select,.filters input{
  height:42px;
  border:1px solid #d8e5f2;
  border-radius:13px;
  background:#fff;
  color:#334155;
  padding:0 11px;
  font-weight:850;
  outline:none;
}
.mail-list{
  max-height:590px;
  overflow:auto;
  padding:12px;
}
.mail-card{
  border:1px solid #edf3fa;
  background:#fff;
  border-radius:18px;
  padding:14px;
  margin-bottom:10px;
  cursor:pointer;
  transition:.16s ease;
  position:relative;
}
.mail-card:hover,.mail-card.active{
  border-color:#8edda8;
  box-shadow:0 14px 28px rgba(32,185,87,.10);
  transform:translateY(-1px);
}
.mail-card.unread{
  border-color:#b7eec8;
  background:linear-gradient(135deg,#ffffff,#f2fff7);
}
.mail-card.unread::before{
  content:"";
  width:9px;
  height:9px;
  border-radius:999px;
  background:#20b957;
  position:absolute;
  left:14px;
  top:20px;
}
.mail-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
  padding-left:16px;
}
.mail-card.read .mail-top{padding-left:0}
.sender{
  color:#071b34;
  font-weight:950;
  font-size:14px;
}
.mail-time{
  color:#74839a;
  font-size:11px;
  font-weight:900;
  white-space:nowrap;
}
.mail-subject{
  margin-top:8px;
  color:#10223d;
  font-size:15px;
  font-weight:950;
  line-height:1.25;
}
.mail-preview{
  margin-top:7px;
  color:#64748b;
  font-size:12px;
  font-weight:800;
  line-height:1.42;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.mail-tags{
  margin-top:10px;
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}
.badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:25px;
  padding:0 9px;
  border-radius:999px;
  background:#e8f8ee;
  color:#137a35;
  font-size:11px;
  font-weight:950;
}
.badge.blue{background:#eaf2ff;color:#1d4ed8}
.badge.orange{background:#fff3df;color:#c46b00}
.badge.red{background:#fee2e2;color:#b91c1c}
.badge.gray{background:#f1f5f9;color:#475569}
.detail-panel{
  min-height:680px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.detail-head{
  min-height:78px;
  padding:17px 18px;
  border-bottom:1px solid #edf3fa;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:13px;
}
.detail-head h2{
  color:#071b34;
  font-size:20px;
  font-weight:950;
}
.detail-actions{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}
.tool-btn{
  height:38px;
  border:1px solid #d8e5f2;
  border-radius:12px;
  background:#fff;
  color:#334155;
  padding:0 12px;
  font-size:12px;
  font-weight:950;
}
.tool-btn:hover{border-color:#a4e3b7;color:#15803d}
.tool-btn.danger{background:#fff5f5;color:#b42318;border-color:#ffd2d2}
.detail-body{
  padding:18px;
  overflow:auto;
  max-height:602px;
}
.empty{
  min-height:300px;
  display:grid;
  place-items:center;
  text-align:center;
  color:#64748b;
  font-weight:950;
}
.mail-detail-title{
  font-size:24px;
  color:#071b34;
  font-weight:950;
  letter-spacing:-.4px;
  line-height:1.2;
}
.detail-meta{
  margin-top:14px;
  border:1px solid #edf3fa;
  border-radius:18px;
  background:#fbfdff;
  padding:13px;
  display:grid;
  gap:8px;
}
.meta-row{
  display:grid;
  grid-template-columns:96px minmax(0,1fr);
  gap:12px;
  color:#475569;
  font-size:13px;
  font-weight:850;
}
.meta-row b{color:#071b34}
.message-content{
  margin-top:16px;
  padding:18px;
  border:1px solid #edf3fa;
  border-radius:20px;
  background:#fff;
  color:#23344f;
  font-size:14px;
  line-height:1.68;
  white-space:pre-wrap;
  min-height:180px;
}
.attachment-list{
  margin-top:14px;
  display:grid;
  gap:8px;
}
.attachment{
  border:1px solid #edf3fa;
  border-radius:14px;
  background:#f8fbff;
  padding:11px 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  color:#334155;
  font-size:12px;
  font-weight:900;
}
.compose-panel{
  display:none;
}
.compose-panel.active{
  display:block;
}
.form{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.field{display:flex;flex-direction:column;gap:7px;position:relative}
.field.full{grid-column:1/-1}
.field label{
  color:#536176;
  font-size:12px;
  font-weight:950;
}
.field input,.field textarea,.field select{
  width:100%;
  border:1px solid #d8e5f2;
  border-radius:14px;
  background:#fff;
  color:#10223d;
  padding:11px 12px;
  font-weight:850;
  outline:none;
}
.field input,.field select{height:44px}
.field textarea{min-height:180px;resize:vertical;line-height:1.5}
.field input:focus,.field textarea:focus,.field select:focus{border-color:#91d9a9;box-shadow:0 0 0 5px rgba(32,185,87,.10)}
.suggest{
  position:absolute;
  z-index:30;
  left:0;
  right:0;
  top:72px;
  background:#fff;
  border:1px solid #dfeaf6;
  border-radius:16px;
  box-shadow:0 20px 44px rgba(7,27,52,.14);
  max-height:260px;
  overflow:auto;
  display:none;
}
.suggest div{
  padding:11px 13px;
  border-bottom:1px solid #edf3fa;
  cursor:pointer;
  font-size:12px;
  font-weight:900;
}
.suggest div:hover{background:#f4fbf7}
.chips{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:7px;
}
.chip{
  display:inline-flex;
  align-items:center;
  gap:7px;
  border-radius:999px;
  background:#e8f8ee;
  color:#137a35;
  padding:6px 10px;
  font-size:11px;
  font-weight:950;
}
.chip button{
  border:none;
  background:transparent;
  color:#b42318;
  font-weight:950;
}
.compose-actions{
  margin-top:15px;
  display:flex;
  gap:9px;
  flex-wrap:wrap;
}
.secondary-btn,.danger-btn{
  height:44px;
  border-radius:14px;
  border:1px solid #d8e5f2;
  padding:0 14px;
  background:#fff;
  color:#334155;
  font-weight:950;
}
.secondary-btn{background:#eefbf3;color:#15803d;border-color:#c7f3d5}
.danger-btn{background:#fff5f5;color:#b42318;border-color:#ffd2d2}
.toast{
  position:fixed;
  right:22px;
  bottom:22px;
  max-width:360px;
  background:#071b34;
  color:#fff;
  padding:13px 15px;
  border-radius:16px;
  box-shadow:0 20px 46px rgba(7,27,52,.22);
  font-weight:900;
  font-size:13px;
  display:none;
  z-index:999;
}
.toast.show{display:block}
@media(max-width:1280px){
  .mail-shell{grid-template-columns:240px minmax(380px,1fr)}
  .detail-panel{grid-column:1/-1}
  .detail-body{max-height:none}
}
@media(max-width:920px){
  .topbar{align-items:flex-start;flex-direction:column}
  .brand{min-width:0}
  .global-search{width:100%;max-width:none}
  .topbar-actions{width:100%;flex-wrap:wrap}
  .mail-shell{grid-template-columns:1fr}
  .sidebar,.mail-list-panel,.detail-panel{min-height:auto}
  .mail-list{max-height:none}
  .hero{align-items:flex-start;flex-direction:column}
  .form{grid-template-columns:1fr}
}
@media(max-width:560px){
  .main{width:94%;padding-top:12px}
  .topbar{border-radius:22px;padding:14px}
  .logo-mark{width:52px;height:52px}
  .logo-text strong{font-size:25px}
  .global-search{flex-direction:column;align-items:stretch}
  .search-btn{width:100%}
  .nav-btn,.user-btn,.logout-btn{min-width:0;width:100%}
  .icon-btn{width:48px}
  .hero h1{font-size:30px}
  .filters{grid-template-columns:1fr}
  .detail-head{align-items:flex-start;flex-direction:column}
}

/* FINAL GDNL LOGO + UNREAD BADGE STANDARD */
.brand{min-width:320px;gap:0}
.logo-full{width:310px;height:auto;display:block;object-fit:contain}
.icon-btn .unread-badge:not(.is-visible),
.folder .count:not(.is-visible){display:none!important}
.folder .count{min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:#ef4444;color:#fff;font-size:11px;font-weight:950;display:none;align-items:center;justify-content:center}
.folder .count.is-visible{display:inline-flex}
@media(max-width:760px){.brand{min-width:230px}.logo-full{width:230px}.topbar{gap:12px}}


/* === GDNL FIX: TOPBAR LOGO + GREEN DEPARTMENT + WORKING SEARCH === */
.topbar{
  display:grid!important;
  grid-template-columns:320px minmax(320px,1fr) auto!important;
  align-items:center!important;
  column-gap:16px!important;
  min-height:92px!important;
}
.topbar .brand{
  display:flex!important;
  align-items:center!important;
  justify-content:flex-start!important;
  visibility:visible!important;
  opacity:1!important;
  width:320px!important;
  min-width:320px!important;
  max-width:320px!important;
  height:64px!important;
  overflow:visible!important;
  position:relative!important;
  z-index:5!important;
}
.topbar .logo-full{
  display:block!important;
  visibility:visible!important;
  opacity:1!important;
  width:300px!important;
  max-width:300px!important;
  height:auto!important;
  object-fit:contain!important;
}
.topbar .global-search{
  width:100%!important;
  max-width:640px!important;
  display:flex!important;
  align-items:center!important;
  gap:10px!important;
  justify-self:start!important;
}
.topbar .search-btn,
#globalSearchBtn{
  min-width:76px!important;
  font-size:13px!important;
  font-weight:950!important;
}
.topbar .nav-btn{
  background:linear-gradient(135deg,#168a3a 0%,#22b14c 52%,#63dc73 100%)!important;
  color:#fff!important;
  border-color:transparent!important;
  box-shadow:0 14px 28px rgba(34,177,76,.20)!important;
}
@media(max-width:1280px){
  .topbar{grid-template-columns:280px minmax(260px,1fr) auto!important;}
  .topbar .brand{width:280px!important;min-width:280px!important;max-width:280px!important;}
  .topbar .logo-full{width:260px!important;max-width:260px!important;}
}
@media(max-width:920px){
  .topbar{display:flex!important;flex-direction:column!important;align-items:flex-start!important;}
  .topbar .brand{width:300px!important;min-width:0!important;max-width:100%!important;}
  .topbar .logo-full{width:280px!important;max-width:100%!important;}
  .topbar .global-search{width:100%!important;max-width:none!important;}
  .topbar .topbar-actions{width:100%!important;}
}
@media(max-width:560px){
  .topbar .brand{width:250px!important;}
  .topbar .logo-full{width:240px!important;}
}

</style>
</head>
<body>

<script src="assets/js/config/api-client.js"></script>
<script>
const api = window.GDNL_API || {};
const safeApi = { redirectOnUnauthorized:false, fallbackOnNotFound:false };

let users = [];
let messages = [];
let recipients = [];
let activeFolder = "inbox";
let selectedMessageId = "";
let attachmentFile = null;
let userSearchTimer = null;
let folderErrors = {};
let unreadCount = 0;
let composeMode = false;
let draftSourceId = "";

const $ = (id) => document.getElementById(id);
const esc = (value) => String(value ?? "")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

const currentUser = () => window.GDNL_CURRENT_USER || {};
const userNameOf = (user) => user?.fullname || user?.name || user?.username || user?.recipient_name || user?.email || "Kullanıcı";
const apiData = (payload) => api.responseData ? api.responseData(payload) : (payload?.data ?? payload);
const apiArray = (payload) => api.asArray ? api.asArray(payload) : (Array.isArray(apiData(payload)) ? apiData(payload) : (apiData(payload)?.items || apiData(payload)?.messages || []));

function showToast(message){
  if(api.showToast){ api.showToast(message); return; }
  $("toast").textContent = message;
  $("toast").classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => $("toast").classList.remove("show"), 2600);
}

function apiErrorMessage(error){
  if(error?.status === 401) return "Oturum süresi doldu, tekrar giriş yapın.";
  if(error?.status === 404) return "Mesaj endpointi bulunamadı.";
  if(error?.status === 500) return "API hata verdi.";
  if(error?.status === 0) return "Sunucuya ulaşılamıyor.";
  return error?.message || "İşlem tamamlanamadı.";
}

async function callApi(method, endpoint, body){
  if(!api[method]) throw new Error("API istemcisi bulunamadı.");
  return await api[method](endpoint, body, safeApi);
}

function apiFolder(folder){
  return folder === "draft" ? "drafts" : folder;
}

function asFolder(message, fallbackFolder){
  if(fallbackFolder === "drafts") return "draft";
  if(fallbackFolder) return fallbackFolder;
  if(message.folder === "drafts") return "draft";
  if(message.folder) return message.folder;
  if(message.status === "draft") return "draft";
  if(message.status === "trash") return "trash";
  if(String(message.sender_id || "") && String(message.sender_id) === String(currentUser().id || "")) return "sent";
  return "inbox";
}

function normalizeAttachment(file){
  const source = file || {};
  return {
    file_id: source.file_id || source.id || "",
    r2_key: source.r2_key || source.key || source.object_key || "",
    filename: source.filename || source.fileName || source.file_name || source.name || "Dosya",
    mime_type: source.mime_type || source.file_type || source.type || "",
    size: source.size || source.file_size || 0,
    url: source.url || source.download_url || ""
  };
}

function normalizeRecipient(recipient){
  const raw = recipient || {};
  const user = api.normalizeUser ? api.normalizeUser(raw) : raw;
  return {
    id: user.id || raw.recipient_id || raw.user_id || "",
    recipient_id: raw.recipient_id || user.id || raw.user_id || "",
    recipient_name: raw.recipient_name || userNameOf(user),
    recipient_email: raw.recipient_email || user.email || "",
    fullname: raw.recipient_name || user.fullname || user.name || user.username || "",
    username: user.username || "",
    email: raw.recipient_email || user.email || "",
    role: user.role || "",
    department: user.department || "",
    status: raw.status || "",
    is_read: raw.is_read === true || raw.is_read === 1 || raw.is_read === "1",
    read_at: raw.read_at || ""
  };
}

function normalizeMessage(message, fallbackFolder){
  const source = apiData(message) || {};
  const attachments = Array.isArray(source.attachments) ? source.attachments.map(normalizeAttachment) : [];
  const normalizedRecipients = Array.isArray(source.recipients) ? source.recipients.map(normalizeRecipient) : [];
  return {
    ...source,
    id: String(source.id || source.message_id || ""),
    folder: asFolder(source, fallbackFolder),
    status: source.status || asFolder(source, fallbackFolder),
    subject: source.subject || "",
    body: source.body || source.message || "",
    recipients: normalizedRecipients,
    sender_id: source.sender_id || source.from_id || "",
    from: source.from || source.sender_name || source.created_by || source.sender || "",
    from_email: source.from_email || source.sender_email || "",
    is_read: source.is_read === true || source.is_read === 1 || source.is_read === "1",
    attachments,
    related_module: source.related_module || "General",
    related_record_id: source.related_record_id || "",
    priority: source.priority || "normal",
    created_at: source.created_at || source.sent_at || source.updated_at || new Date().toISOString()
  };
}

function folderLabel(folder){
  return { inbox:"Gelen Kutusu", sent:"Giden Kutusu", draft:"Taslaklar", trash:"Çöp Kutusu", compose:"Yeni Mesaj" }[folder] || "Gelen Kutusu";
}

function priorityLabel(priority){
  return { normal:"Normal", high:"Yüksek", critical:"Kritik" }[priority] || "Normal";
}

function priorityClass(priority){
  return priority === "critical" ? "red" : priority === "high" ? "orange" : "";
}

function formatDate(value){
  const date = new Date(value || Date.now());
  return Number.isNaN(date.getTime()) ? "-" : date.toLocaleString("tr-TR", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });
}

function messageCountsAsUnread(message){
  if(!message || message.folder !== "inbox") return false;
  if(!message.is_read) return true;
  const userId = String(currentUser().id || "");
  return (message.recipients || []).some((recipient) => (
    String(recipient.recipient_id || recipient.id || "") === userId &&
    (recipient.is_read === false || !recipient.read_at)
  ));
}

function localUnreadCount(){
  return messages.filter(messageCountsAsUnread).length;
}

function applyUnreadBadge(count){
  const value = Number(count || 0);
  unreadCount = value;
  const topBadge = $("topUnreadBadge");
  const inboxBadge = $("countInbox");
  [topBadge,inboxBadge].forEach((badge) => {
    if(!badge) return;
    if(value > 0){
      badge.textContent = value > 99 ? "99+" : String(value);
      badge.classList.add("is-visible");
    }else{
      badge.textContent = "";
      badge.classList.remove("is-visible");
    }
  });
  document.querySelectorAll(".gdnl-mail-unread-badge").forEach((badge) => {
    if(value > 0){
      badge.textContent = value > 99 ? "99+" : String(value);
      badge.classList.add("is-visible");
    }else{
      badge.textContent = "";
      badge.classList.remove("is-visible");
    }
  });
}

async function refreshUnreadCount(options = {}){
  let value = localUnreadCount();
  try{
    const payload = await api.get("/messages/unread-count", safeApi);
    const data = apiData(payload) || {};
    const apiCount = Number(data.unread_count || data.count || 0);
    value = messages.length ? Math.min(Math.max(value,0), Math.max(apiCount,value)) : apiCount;
    if(options.readApplied) value = localUnreadCount();
  }catch(error){
    value = localUnreadCount();
  }
  applyUnreadBadge(value);
  return value;
}

function scheduleUnreadRefresh(){
  refreshUnreadCount();
  [300,1000,2500].forEach((delay) => setTimeout(refreshUnreadCount, delay));
  if(!window.__gdnlMailboxUnreadTimer){
    window.__gdnlMailboxUnreadTimer = setInterval(refreshUnreadCount, 60000);
  }
}

async function loadUsers(query = ""){
  const endpoint = "/users" + (query ? "?q=" + encodeURIComponent(query) : "");
  const payload = await callApi("get", endpoint);
  users = apiArray(payload).map((item) => api.normalizeUser ? api.normalizeUser(item) : item);
  return users;
}

async function initSessionUser(){
  try{
    const payload = await callApi("get", "/me");
    const data = apiData(payload);
    const user = api.normalizeUser ? api.normalizeUser(data?.user || data || {}) : (data?.user || data || {});
    window.GDNL_CURRENT_USER = user;
    $("userName").textContent = userNameOf(user);
    return user;
  }catch(error){
    $("userName").textContent = "Kullanıcı";
    return {};
  }
}

async function loadFolder(folder){
  const endpoint = "/messages?folder=" + encodeURIComponent(apiFolder(folder));
  const payload = await callApi("get", endpoint);
  return apiArray(payload).map((message) => normalizeMessage(message, folder));
}

async function load(){
  await initSessionUser();
  try{ await loadUsers(); }catch(error){ users = []; }

  const loaded = [];
  folderErrors = {};
  for(const folder of ["inbox","sent","draft","trash"]){
    try{ loaded.push(...await loadFolder(folder)); }
    catch(error){ folderErrors[folder] = apiErrorMessage(error); }
  }
  messages = loaded.filter((message) => message.id);
  await refreshUnreadCount();
  render();
  scheduleUnreadRefresh();
}

function setActiveFolder(folder){
  activeFolder = folder;
  composeMode = folder === "compose";
  selectedMessageId = "";
  render();
}

function currentQuery(){
  return `${$("searchBox").value || ""} ${$("nameFilter").value || ""}`.trim().toLocaleLowerCase("tr-TR");
}

function filteredRows(){
  const query = currentQuery();
  const priorityValue = $("priorityFilter").value;
  const moduleValue = $("moduleFilter").value;
  const rows = messages.filter((message) => (
    message.folder === activeFolder &&
    (!priorityValue || message.priority === priorityValue) &&
    (!moduleValue || message.related_module === moduleValue) &&
    `${message.subject} ${message.body} ${message.from} ${message.from_email} ${message.related_module} ${(message.recipients || []).map(userNameOf).join(" ")}`
      .toLocaleLowerCase("tr-TR")
      .includes(query)
  ));
  rows.sort((a,b) => {
    const da = new Date(a.created_at).getTime() || 0;
    const db = new Date(b.created_at).getTime() || 0;
    return $("dateSort").value === "oldest" ? da - db : db - da;
  });
  return rows;
}

function render(){
  document.querySelectorAll(".folder").forEach((button) => button.classList.toggle("active", button.dataset.folder === activeFolder));
  $("folderTitle").textContent = folderLabel(activeFolder);
  $("heroMeta").textContent = folderLabel(activeFolder);
  $("folderState").textContent = folderErrors[activeFolder] ? "API Hatası" : "Canlı";
  applyUnreadBadge(unreadCount || localUnreadCount());

  if(composeMode){
    renderCompose();
    $("messageList").innerHTML = `<div class="empty">Yeni mesaj hazırlanıyor.</div>`;
    return;
  }

  if(folderErrors[activeFolder]){
    $("messageList").innerHTML = `<div class="empty">${esc(folderErrors[activeFolder])}</div>`;
    renderEmptyDetail();
    return;
  }

  const rows = filteredRows();
  $("messageList").innerHTML = rows.length ? rows.map(renderMessageCard).join("") : `<div class="empty">${folderLabel(activeFolder)} içinde mesaj bulunmuyor.</div>`;
  renderDetail();
}

function renderMessageCard(message){
  const unread = messageCountsAsUnread(message);
  return `
    <article class="mail-card ${unread ? "unread" : "read"} ${message.id === selectedMessageId ? "active" : ""}" onclick="openMessage('${esc(message.id)}')">
      <div class="mail-top">
        <div class="sender">${esc(message.from || "Kullanıcı")}</div>
        <div class="mail-time">${esc(formatDate(message.created_at))}</div>
      </div>
      <div class="mail-subject">${esc(message.subject || "(Konu yok)")}</div>
      <div class="mail-preview">${esc(message.body || "")}</div>
      <div class="mail-tags">
        <span class="badge ${priorityClass(message.priority)}">${esc(priorityLabel(message.priority))}</span>
        <span class="badge blue">${esc(message.related_module || "General")}</span>
        ${(message.attachments || []).length ? `<span class="badge orange">📎 ${message.attachments.length} ek</span>` : ""}
        ${unread ? `<span class="badge">Okunmadı</span>` : `<span class="badge gray">Okundu</span>`}
      </div>
    </article>`;
}

function renderEmptyDetail(){
  $("detailTitle").textContent = "Mesaj Detayı";
  $("detailActions").innerHTML = "";
  $("messageDetail").innerHTML = `<div class="empty">Detay için bir mesaj seçin.</div>`;
}

function renderDetail(){
  const message = messages.find((item) => item.id === selectedMessageId);
  if(!message){ renderEmptyDetail(); return; }

  $("detailTitle").textContent = "Mesaj Detayı";
  $("detailActions").innerHTML = `
    <button class="tool-btn" onclick="replyTo('${esc(message.id)}')">Yanıtla</button>
    <button class="tool-btn" onclick="replyAllTo('${esc(message.id)}')">Tümünü Yanıtla</button>
    <button class="tool-btn" onclick="forwardMessage('${esc(message.id)}')">İlet</button>
    <button class="tool-btn" onclick="toggleRead('${esc(message.id)}')">${messageCountsAsUnread(message) ? "Okundu Yap" : "Okunmadı Yap"}</button>
    ${message.folder === "trash"
      ? `<button class="tool-btn" onclick="restoreMessage('${esc(message.id)}')">Geri Yükle</button><button class="tool-btn danger" onclick="permanentDelete('${esc(message.id)}')">Kalıcı Sil</button>`
      : `<button class="tool-btn danger" onclick="moveTrash('${esc(message.id)}')">Sil</button>`}
  `;

  $("messageDetail").innerHTML = `
    <div class="mail-detail-title">${esc(message.subject || "(Konu yok)")}</div>
    <div class="detail-meta">
      <div class="meta-row"><b>Gönderen</b><span>${esc(message.from || "Kullanıcı")} ${message.from_email ? "· " + esc(message.from_email) : ""}</span></div>
      <div class="meta-row"><b>Tarih</b><span>${esc(formatDate(message.created_at))}</span></div>
      <div class="meta-row"><b>Alıcılar</b><span>${(message.recipients || []).map((r) => `<span class="chip">${esc(userNameOf(r))}</span>`).join(" ") || "-"}</span></div>
      <div class="meta-row"><b>Öncelik</b><span>${esc(priorityLabel(message.priority))}</span></div>
      <div class="meta-row"><b>Modül</b><span>${esc(message.related_module || "General")}${message.related_record_id ? " · #" + esc(message.related_record_id) : ""}</span></div>
      <div class="meta-row"><b>Durum</b><span>${messageCountsAsUnread(message) ? "Okunmadı" : "Okundu"}</span></div>
    </div>
    <div class="message-content">${esc(message.body || "")}</div>
    ${(message.attachments || []).length ? `<div class="attachment-list">${message.attachments.map((attachment) => `
      <div class="attachment">
        <span>📎 ${esc(attachment.filename)} ${attachment.size ? "(" + esc(attachment.size) + " byte)" : ""}</span>
        ${attachment.url ? `<a class="tool-btn" href="${esc(attachment.url)}" target="_blank" rel="noopener">Aç</a>` : `<span class="badge gray">R2</span>`}
      </div>`).join("")}</div>` : ""}
  `;
}

function renderCompose(){
  $("detailTitle").textContent = draftSourceId ? "Mesajı Düzenle" : "Yeni Mesaj";
  $("detailActions").innerHTML = `<button class="tool-btn" onclick="setActiveFolder('inbox')">Kapat</button>`;
  $("messageDetail").innerHTML = `
    <div class="compose-panel active">
      <div class="form">
        <div class="field full">
          <label>Alıcılar</label>
          <input id="recipientInput" autocomplete="off" placeholder="Kişi ara ve seç">
          <div id="suggestions" class="suggest"></div>
          <div id="recipientChips" class="chips"></div>
        </div>
        <div class="field full"><label>Konu</label><input id="subject" placeholder="Mesaj konusu"></div>
        <div class="field full"><label>Mesaj İçeriği</label><textarea id="body" placeholder="Mesajınızı yazın"></textarea></div>
        <div class="field"><label>Öncelik</label><select id="priority"><option value="normal">Normal</option><option value="high">Yüksek</option><option value="critical">Kritik</option></select></div>
        <div class="field"><label>İlgili Modül</label><select id="relatedModule"><option>General</option><option>Document</option><option>CAPA</option><option>Risk</option><option>Audit</option><option>Training</option><option>Supplier</option><option>Customer Complaint</option><option>Calibration</option><option>Maintenance</option><option>Action</option></select></div>
        <div class="field"><label>İlgili Kayıt No</label><input id="relatedRecordId" placeholder="Kayıt no"></div>
        <div class="field full"><label>Ek Dosya</label><input id="attachment" type="file"></div>
      </div>
      <div class="compose-actions">
        <button class="primary-btn" type="button" onclick="sendMessage()">Gönder</button>
        <button class="secondary-btn" type="button" onclick="saveDraft()">Taslak Kaydet</button>
        <button class="danger-btn" type="button" onclick="clearCompose()">Temizle</button>
      </div>
    </div>
  `;
  $("recipientInput").addEventListener("input", () => {
    clearTimeout(userSearchTimer);
    userSearchTimer = setTimeout(searchUsers, 220);
  });
  $("attachment").addEventListener("change", (event) => {
    attachmentFile = event.target.files[0] || null;
  });
  restoreComposeValues();
  renderRecipients();
}

let composeValues = { subject:"", body:"", priority:"normal", relatedModule:"General", relatedRecordId:"" };

function cacheComposeValues(){
  if(!$("subject")) return;
  composeValues = {
    subject:$("subject").value,
    body:$("body").value,
    priority:$("priority").value,
    relatedModule:$("relatedModule").value,
    relatedRecordId:$("relatedRecordId").value
  };
}

function restoreComposeValues(){
  if(!$("subject")) return;
  $("subject").value = composeValues.subject || "";
  $("body").value = composeValues.body || "";
  $("priority").value = composeValues.priority || "normal";
  $("relatedModule").value = composeValues.relatedModule || "General";
  $("relatedRecordId").value = composeValues.relatedRecordId || "";
}

function renderRecipients(){
  if(!$("recipientChips")) return;
  $("recipientChips").innerHTML = recipients.map((recipient,index) => `
    <span class="chip">${esc(userNameOf(recipient))}
      <button type="button" onclick="removeRecipient(${index})">×</button>
    </span>`).join("");
}

function removeRecipient(index){
  recipients.splice(index,1);
  renderRecipients();
}

async function searchUsers(){
  const input = $("recipientInput");
  const suggestions = $("suggestions");
  const query = input.value.trim();
  try{
    const found = await loadUsers(query);
    suggestions.innerHTML = found.slice(0,12).map((user,index) => `
      <div data-i="${index}">
        ${esc(userNameOf(user))}<br>
        <small>${esc(user.email || "")} · ${esc(user.department || "")}</small>
      </div>`).join("");
    suggestions.style.display = found.length ? "block" : "none";
    suggestions.querySelectorAll("[data-i]").forEach((item) => {
      item.onclick = () => {
        const user = found[Number(item.dataset.i)];
        if(user && !recipients.some((r) => String(r.id || r.recipient_id) === String(user.id))) recipients.push(user);
        input.value = "";
        suggestions.style.display = "none";
        renderRecipients();
      };
    });
  }catch(error){
    suggestions.style.display = "none";
    showToast(apiErrorMessage(error));
  }
}

function recipientPayload(){
  return recipients.map(normalizeRecipient).map((recipient) => ({
    recipient_id: recipient.recipient_id || recipient.id,
    recipient_name: userNameOf(recipient),
    recipient_email: recipient.recipient_email || recipient.email || ""
  })).filter((recipient) => recipient.recipient_id);
}

async function uploadAttachment(recordId){
  const fileInput = $("attachment");
  const file = attachmentFile || fileInput?.files?.[0] || null;
  if(!file) return null;
  const form = new FormData();
  form.append("file", file);
  form.append("module", "mailbox");
  form.append("related_id", recordId);
  form.append("category", "Mesaj Eki");
  form.append("uploaded_by", userNameOf(currentUser()));
  const payload = await api.request("/upload", { method:"POST", body:form, redirectOnUnauthorized:false, fallbackOnNotFound:false });
  const data = apiData(payload);
  return normalizeAttachment(data?.file || data);
}

async function buildPayload(status){
  cacheComposeValues();
  const id = draftSourceId || "MSG-" + Date.now();
  const attachments = [];
  const uploaded = await uploadAttachment(id);
  if(uploaded) attachments.push(uploaded);
  return {
    id,
    subject: composeValues.subject.trim(),
    body: composeValues.body.trim(),
    recipients: recipientPayload(),
    priority: composeValues.priority || "normal",
    status,
    related_module: composeValues.relatedModule || "General",
    related_record_id: composeValues.relatedRecordId.trim(),
    attachments
  };
}

function validatePayload(payload){
  if(payload.status === "sent" && !payload.recipients.length) return "Alıcı seçilmeden mesaj gönderilemez.";
  if(payload.status === "sent" && !payload.subject) return "Konu girilmeden mesaj gönderilemez.";
  if(payload.status === "sent" && !payload.body) return "Mesaj içeriği girilmeden mesaj gönderilemez.";
  if(payload.recipients.some((recipient) => !recipient.recipient_id)) return "Alıcı kimliği eksik.";
  return "";
}

async function writeActivity(action, message){
  const payload = {
    module:"mailbox",
    related_module:"mailbox",
    related_record_id:message?.id || "",
    action,
    description:message?.subject || "",
    user_id:currentUser().id || "",
    user_name:userNameOf(currentUser()),
    created_at:new Date().toISOString()
  };
  api.post?.("/activity-feed", payload, safeApi).catch(() => {});
  api.post?.("/audit-logs", payload, safeApi).catch(() => {});
}

async function save(status){
  const payload = await buildPayload(status);
  const validation = validatePayload(payload);
  if(validation){ showToast(validation); return; }

  try{
    const saved = await callApi("post", "/messages", payload);
    const savedMessage = normalizeMessage(apiData(saved), status === "draft" ? "draft" : "sent");
    await writeActivity(status === "draft" ? "Taslak kaydedildi" : "Mesaj gönderildi", savedMessage);
    clearCompose(false);
    activeFolder = status === "draft" ? "draft" : "sent";
    composeMode = false;
    await load();
    selectedMessageId = savedMessage.id;
    showToast(status === "draft" ? "Taslak kaydedildi" : "Mesaj gönderildi");
    window.GDNL_API?.updateMailboxUnreadBadge?.();
    render();
  }catch(error){
    showToast(apiErrorMessage(error));
  }
}

function sendMessage(){ save("sent"); }
function saveDraft(){ save("draft"); }

function clearCompose(show = true){
  recipients = [];
  attachmentFile = null;
  draftSourceId = "";
  composeValues = { subject:"", body:"", priority:"normal", relatedModule:"General", relatedRecordId:"" };
  if($("attachment")) $("attachment").value = "";
  restoreComposeValues();
  renderRecipients();
  if(show) showToast("Mesaj formu temizlendi");
}

function openCompose(){
  composeMode = true;
  activeFolder = "compose";
  selectedMessageId = "";
  draftSourceId = "";
  clearCompose(false);
  render();
}

async function openMessage(id){
  try{
    const detail = normalizeMessage(await callApi("get", "/messages/" + encodeURIComponent(id)));
    const index = messages.findIndex((message) => message.id === detail.id);
    if(index >= 0) messages[index] = { ...messages[index], ...detail };
    else messages.unshift(detail);
    selectedMessageId = detail.id;
    composeMode = false;
    if(activeFolder === "inbox" && messageCountsAsUnread(detail)) await markRead(id, true);
  }catch(error){
    selectedMessageId = id;
    composeMode = false;
    showToast(apiErrorMessage(error));
  }
  render();
}

function replyTo(id){
  const message = messages.find((item) => item.id === id);
  if(!message) return;
  recipients = message.sender_id || message.from ? [normalizeRecipient({ id:message.sender_id, fullname:message.from, email:message.from_email || "" })] : [];
  composeValues = {
    subject:/^Yanıt:/i.test(message.subject) ? message.subject : "Yanıt: " + (message.subject || ""),
    body:"\n\n--- Önceki Mesaj ---\n" + (message.body || ""),
    priority:message.priority || "normal",
    relatedModule:message.related_module || "General",
    relatedRecordId:message.related_record_id || ""
  };
  activeFolder = "compose";
  composeMode = true;
  render();
}

function replyAllTo(id){
  const message = messages.find((item) => item.id === id);
  if(!message) return;
  const all = [];
  if(message.sender_id || message.from) all.push(normalizeRecipient({ id:message.sender_id, fullname:message.from, email:message.from_email || "" }));
  (message.recipients || []).forEach((recipient) => {
    if(String(recipient.id || recipient.recipient_id) !== String(currentUser().id || "")) all.push(recipient);
  });
  const seen = new Set();
  recipients = all.filter((recipient) => {
    const key = String(recipient.id || recipient.recipient_id || recipient.email || userNameOf(recipient));
    if(seen.has(key)) return false;
    seen.add(key);
    return true;
  });
  composeValues = {
    subject:/^Yanıt:/i.test(message.subject) ? message.subject : "Yanıt: " + (message.subject || ""),
    body:"\n\n--- Önceki Mesaj ---\n" + (message.body || ""),
    priority:message.priority || "normal",
    relatedModule:message.related_module || "General",
    relatedRecordId:message.related_record_id || ""
  };
  activeFolder = "compose";
  composeMode = true;
  render();
}

function forwardMessage(id){
  const message = messages.find((item) => item.id === id);
  if(!message) return;
  recipients = [];
  composeValues = {
    subject:/^İlet:/i.test(message.subject) ? message.subject : "İlet: " + (message.subject || ""),
    body:"\n\n--- İletilen Mesaj ---\nGönderen: " + (message.from || "Kullanıcı") + "\nTarih: " + formatDate(message.created_at) + "\n\n" + (message.body || ""),
    priority:message.priority || "normal",
    relatedModule:message.related_module || "General",
    relatedRecordId:message.related_record_id || ""
  };
  activeFolder = "compose";
  composeMode = true;
  render();
}

async function markRead(id, silent = false){
  const message = messages.find((item) => item.id === id);
  if(!message) return;
  const wasUnread = messageCountsAsUnread(message);
  try{
    await callApi("put", "/messages/" + encodeURIComponent(id) + "/read", { is_read:true, read_at:new Date().toISOString() });
    message.is_read = true;
    (message.recipients || []).forEach((recipient) => {
      if(String(recipient.recipient_id || recipient.id || "") === String(currentUser().id || "")){
        recipient.is_read = true;
        recipient.status = "READ";
        recipient.read_at = new Date().toISOString();
      }
    });
    await refreshUnreadCount({ readApplied:wasUnread });
    await writeActivity("Mesaj okundu", message);
    if(!silent) showToast("Mesaj okundu olarak işaretlendi");
  }catch(error){
    showToast(apiErrorMessage(error));
  }
  if(!silent) render();
}

async function markUnread(id){
  const message = messages.find((item) => item.id === id);
  if(!message) return;
  try{
    await callApi("put", "/messages/" + encodeURIComponent(id) + "/read", { is_read:false, read_at:null });
    message.is_read = false;
    (message.recipients || []).forEach((recipient) => {
      if(String(recipient.recipient_id || recipient.id || "") === String(currentUser().id || "")){
        recipient.is_read = false;
        recipient.status = "UNREAD";
        recipient.read_at = "";
      }
    });
    await refreshUnreadCount();
    await writeActivity("Mesaj okunmadı yapıldı", message);
    showToast("Mesaj okunmadı olarak işaretlendi");
  }catch(error){
    showToast(apiErrorMessage(error));
  }
  render();
}

function toggleRead(id){
  const message = messages.find((item) => item.id === id);
  if(!message) return;
  if(messageCountsAsUnread(message)) markRead(id);
  else markUnread(id);
}

async function moveTrash(id){
  const message = messages.find((item) => item.id === id);
  if(!message) return;
  try{
    await callApi("put", "/messages/" + encodeURIComponent(id) + "/trash", { status:"trash", deleted_at:new Date().toISOString() });
    await writeActivity("Mesaj çöpe taşındı", message);
    activeFolder = "trash";
    composeMode = false;
    await load();
    selectedMessageId = id;
    showToast("Mesaj çöp kutusuna taşındı");
    window.GDNL_API?.updateMailboxUnreadBadge?.();
  }catch(error){
    showToast(apiErrorMessage(error));
  }
  render();
}

async function restoreMessage(id){
  const message = messages.find((item) => item.id === id);
  if(!message) return;
  try{
    const restored = normalizeMessage(await callApi("put", "/messages/" + encodeURIComponent(id) + "/restore", { deleted_at:null }));
    await writeActivity("Mesaj geri yüklendi", message);
    activeFolder = restored.folder === "sent" ? "sent" : "inbox";
    composeMode = false;
    await load();
    selectedMessageId = id;
    showToast("Mesaj geri yüklendi");
    window.GDNL_API?.updateMailboxUnreadBadge?.();
  }catch(error){
    showToast(apiErrorMessage(error));
  }
  render();
}

async function permanentDelete(id){
  const message = messages.find((item) => item.id === id);
  if(!message) return;
  let approved = true;
  if(api.showConfirm) approved = await api.showConfirm("Bu mesaj kalıcı olarak silinecek. Devam edilsin mi?");
  else approved = confirm("Bu mesaj kalıcı olarak silinecek. Devam edilsin mi?");
  if(!approved) return;
  try{
    await callApi("delete", "/messages/" + encodeURIComponent(id) + "/permanent");
    await writeActivity("Mesaj kalıcı silindi", message);
    selectedMessageId = "";
    activeFolder = "trash";
    composeMode = false;
    await load();
    showToast("Mesaj kalıcı olarak silindi");
    window.GDNL_API?.updateMailboxUnreadBadge?.();
  }catch(error){
    showToast(apiErrorMessage(error));
  }
  render();
}

document.querySelectorAll(".folder").forEach((button) => {
  button.addEventListener("click", () => setActiveFolder(button.dataset.folder));
});

["searchBox","nameFilter"].forEach((id) => {
  $(id).addEventListener("input", render);
});
["priorityFilter","moduleFilter","dateSort"].forEach((id) => {
  $(id).addEventListener("change", render);
});
$("globalSearchBtn").addEventListener("click", render);

load();
</script>
