<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GDNL EQMS | Mesaj Merkezi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Arial,sans-serif}body{background:#f4f9ff;color:#172033;min-height:100vh;overflow-x:hidden}.main{max-width:1440px;margin:0 auto;padding:24px}.topbar,.panel,.card{background:rgba(255,255,255,.94);border:1px solid #dfe9f5;border-radius:22px;box-shadow:0 16px 42px rgba(7,27,52,.07)}.topbar{min-height:64px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.brand{font-size:24px;font-weight:950;color:#071b34;text-decoration:none}.brand span{color:#35a852}.search{height:40px;border:1px solid #d8e4ef;border-radius:12px;padding:0 12px;font-weight:800;min-width:260px}.user{display:inline-flex;gap:7px;font-weight:900}.hero h1{font-size:34px;font-weight:950;color:#071b34}.hero p{margin:8px 0 18px;color:#617086;font-weight:800}.grid{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px}.panel{padding:18px;overflow:auto}.panel h2{font-size:18px;font-weight:950;color:#071b34;margin-bottom:12px}.folder{width:100%;height:42px;border:none;border-radius:13px;background:#f8fbff;color:#536176;font-weight:950;text-align:left;padding:0 12px;margin-bottom:8px;cursor:pointer}.folder.active{background:#e8f7ee;color:#1f7d3d}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:16px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:950;color:#617086}.field input,.field textarea,.field select{width:100%;border:1px solid #d8e4ef;border-radius:13px;padding:10px 12px;font-weight:800;background:#fff}.field input,.field select{height:42px}.field textarea{min-height:92px;resize:vertical}.btn{height:40px;border:none;border-radius:12px;padding:0 13px;font-weight:950;cursor:pointer;background:linear-gradient(135deg,#1f8f43,#35a852,#62d46f);color:#fff}.btn.secondary{background:#dcfce7;color:#15803d}.btn.danger{background:#fee2e2;color:#991b1b}.actions{display:flex;gap:10px;flex-wrap:wrap}.message{border:1px solid #edf2f7;border-radius:16px;padding:14px;margin-bottom:10px;background:#fff}.message b{display:block;color:#071b34}.message small{display:block;margin-top:5px;color:#617086;font-weight:800}.message.active{border-color:#35a852;box-shadow:0 12px 30px rgba(53,168,82,.12)}.chip{display:inline-flex;border-radius:999px;background:#e8f7ee;color:#1f7d3d;padding:5px 9px;font-size:11px;font-weight:950;margin:6px 6px 0 0}.empty{padding:24px;text-align:center;color:#64748b;font-weight:900}.suggest{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid #dfe9f5;border-radius:14px;box-shadow:0 18px 45px rgba(7,27,52,.12);display:none;z-index:10;max-height:220px;overflow:auto}.suggest div{padding:10px 12px;border-bottom:1px solid #edf2f7;cursor:pointer;font-size:12px;font-weight:900}.recipient-wrap{position:relative}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}.detail{line-height:1.6;color:#334155}.detail b{color:#071b34}.detail-box{border:1px solid #edf2f7;border-radius:16px;padding:14px;background:#fff;margin-top:10px}@media(max-width:820px){.grid{grid-template-columns:1fr}.topbar{flex-wrap:wrap}.search{width:100%;min-width:0}.main{padding:16px}}
</style>
</head>
<body>
<main class="main">
<div class="topbar"><a class="brand" href="dashboard.html">GDNL <span>EQMS</span></a><input id="searchBox" class="search" placeholder="Ara..."><div class="user">👤 <span id="userName">Kullanıcı</span></div></div>
<section class="hero"><h1>Mesaj Merkezi</h1><p>Kurumsal Haberleşme. GDNL EOS iç mesajlaşma, çoklu alıcı, R2 dosya eki, taslak ve okundu bilgisi.</p></section>
<section class="grid">
<aside class="panel">
<button class="folder active" data-folder="inbox">Gelen Kutusu</button>
<button class="folder" data-folder="sent">Giden Kutusu</button>
<button class="folder" data-folder="draft">Taslaklar</button>
<button class="folder" data-folder="trash">Çöp Kutusu</button>
</aside>
<section class="panel">
<h2>Yeni Mesaj Oluştur</h2>
<div class="form">
<div class="field full recipient-wrap"><label>Alıcılar</label><input id="recipientInput" autocomplete="off" placeholder="Kullanıcı ara ve seç"><div id="suggestions" class="suggest"></div><div id="recipientChips" class="chips"></div></div>
<div class="field full"><label>Konu</label><input id="subject"></div>
<div class="field full"><label>Mesaj</label><textarea id="body"></textarea></div>
<div class="field"><label>İlgili Modül</label><select id="relatedModule"><option>General</option><option>Document</option><option>CAPA</option><option>Risk</option><option>Audit</option><option>Training</option><option>Supplier</option><option>Customer Complaint</option><option>Calibration</option><option>Maintenance</option><option>Action</option></select></div>
<div class="field"><label>İlgili Kayıt</label><input id="relatedRecordId" placeholder="Kayıt ID"></div>
<div class="field"><label>Öncelik</label><select id="priority"><option value="normal">Normal</option><option value="high">Yüksek</option><option value="critical">Kritik</option></select></div>
<div class="field full"><label>R2 Dosya Eki</label><input id="attachment" type="file"></div>
</div>
<div class="actions"><button class="btn" onclick="sendMessage()">Gönder</button><button class="btn secondary" onclick="saveDraft()">Taslak Kaydet</button><button class="btn danger" onclick="clearCompose()">Temizle</button></div>
</section>
</section>
<section class="panel" style="margin-top:16px"><div id="messageList" class="empty">Yükleniyor...</div></section>
<section class="panel" style="margin-top:16px"><h2>Mesaj Detayı</h2><div id="messageDetail" class="empty">Detay için bir mesaj seç.</div></section>
</main>
<script src="assets/js/config/api-client.js"></script>
<script>
const api=window.GDNL_API;let users=[],messages=[],recipients=[],folder="inbox",attachmentFile=null,selectedMessageId="";
const currentUser=()=>window.GDNL_CURRENT_USER||{};
const userNameOf=u=>u.fullname||u.username||"Kullanıcı";
function messageFolder(m){if(m.folder||m.status_folder)return m.folder||m.status_folder;if(m.status==="draft"||m.status==="trash")return m.status;if(m.sender_id&&String(m.sender_id)===String(currentUser().id))return"sent";return"inbox"}
function normalizeAttachment(file){const source=file||{};return{file_id:source.file_id||source.id||"",r2_key:source.r2_key||source.key||source.object_key||"",filename:source.filename||source.fileName||source.file_name||source.name||"Dosya",mime_type:source.mime_type||source.type||"",size:source.size||0}}
function normalizeMessage(m){const attachments=Array.isArray(m.attachments)?m.attachments.map(normalizeAttachment):(m.attachment||m.file?[normalizeAttachment(m.attachment||m.file)]:[]);return{...m,id:m.id||m.message_id||("MSG-"+Date.now()),folder:messageFolder(m),status:m.status||messageFolder(m),subject:m.subject||"",body:m.body||m.message||"",recipients:Array.isArray(m.recipients)?m.recipients.map(api.normalizeUser):[],from:m.from||m.sender_name||m.created_by||"",sender:m.sender||null,sender_id:m.sender_id||m.from_id||"",is_read:Boolean(m.is_read),attachments,attachment:attachments[0]||null,related_module:m.related_module||"General",related_record_id:m.related_record_id||"",priority:m.priority||"normal",created_at:m.created_at||new Date().toISOString()}}
async function load(){try{users=await api.loadUsers()}catch(e){users=[]}try{messages=api.asArray(await api.get("/messages")).map(normalizeMessage)}catch(e){messages=[]}render()}
function escapeHTML(value){return String(value||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function priorityLabel(value){return({normal:"Normal",high:"Yüksek",critical:"Kritik"}[value]||"Normal")}
function render(){const q=searchBox.value.toLowerCase();const rows=messages.filter(m=>m.folder===folder&&`${m.subject} ${m.body} ${m.from} ${m.related_module}`.toLowerCase().includes(q));messageList.innerHTML=rows.length?rows.map(m=>`<div class="message ${m.id===selectedMessageId?"active":""}"><b>${m.is_read?"":"● "}${escapeHTML(m.subject||"(Konu yok)")}</b><small>${escapeHTML(m.from||"Kullanıcı")} · ${escapeHTML(m.created_at)}</small><p>${escapeHTML(m.body||"")}</p><span class="chip">${escapeHTML(priorityLabel(m.priority))}</span><span class="chip">${escapeHTML(m.related_module||"General")}</span>${(m.recipients||[]).map(r=>`<span class="chip">${escapeHTML(r.fullname||r.username||"Kullanıcı")}</span>`).join("")}${(m.attachments||[]).map(a=>`<span class="chip">Ek: ${escapeHTML(a.filename||"Dosya")}</span>`).join("")}<div class="actions" style="margin-top:10px"><button class="btn secondary" onclick="openMessage('${m.id}')">Detay</button><button class="btn secondary" onclick="replyTo('${m.id}')">Yanıtla</button><button class="btn secondary" onclick="markRead('${m.id}')">Okundu</button>${m.folder==="trash"?`<button class="btn secondary" onclick="restoreMessage('${m.id}')">Geri Yükle</button>`:`<button class="btn danger" onclick="moveTrash('${m.id}')">Çöp</button>`}</div></div>`).join(""):'<div class="empty">Mesaj bulunamadı.</div>';renderDetail()}
function renderDetail(){const m=messages.find(x=>x.id===selectedMessageId);if(!m){messageDetail.innerHTML='<div class="empty">Detay için bir mesaj seç.</div>';return}messageDetail.innerHTML=`<div class="detail"><b>Konu:</b> ${escapeHTML(m.subject||"(Konu yok)")}<br><b>Gönderen:</b> ${escapeHTML(m.from||"Kullanıcı")}<br><b>Tarih:</b> ${escapeHTML(m.created_at)}<br><b>Durum:</b> ${m.is_read?"Okundu":"Okunmadı"}<br><b>Öncelik:</b> ${escapeHTML(priorityLabel(m.priority))}<br><b>İlgili Kayıt:</b> ${escapeHTML(m.related_module||"General")} ${m.related_record_id?"#"+escapeHTML(m.related_record_id):""}<br><b>Alıcılar:</b><br>${(m.recipients||[]).map(r=>`<span class="chip">${escapeHTML(r.fullname||r.username||"Kullanıcı")}${r.department?" / "+escapeHTML(r.department):""}</span>`).join("")||"-"}<div class="detail-box">${escapeHTML(m.body||"")}</div>${(m.attachments||[]).map(a=>`<div class="detail-box"><b>R2 Ek:</b> ${escapeHTML(a.filename||"Dosya")} ${a.size?`(${escapeHTML(a.size)} byte)`:""}</div>`).join("")}</div>`}
async function openMessage(id){selectedMessageId=id;await markRead(id,true);render()}
function renderRecipients(){recipientChips.innerHTML=recipients.map((u,i)=>`<span class="chip">${userNameOf(u)} <button onclick="recipients.splice(${i},1);renderRecipients()" style="border:none;background:transparent;color:#991b1b;font-weight:950">×</button></span>`).join("")}
recipientInput.addEventListener("input",()=>{const q=recipientInput.value.toLowerCase();const found=users.filter(u=>`${u.fullname} ${u.username} ${u.email} ${u.department}`.toLowerCase().includes(q)).slice(0,10);suggestions.innerHTML=found.map((u,i)=>`<div data-i="${i}">${userNameOf(u)}<br><small>${u.email||""} · ${u.department||""}</small></div>`).join("");suggestions.style.display=found.length?"block":"none";suggestions.querySelectorAll("[data-i]").forEach(el=>el.onclick=()=>{const u=found[Number(el.dataset.i)];if(!recipients.some(r=>String(r.id)===String(u.id)))recipients.push(u);recipientInput.value="";suggestions.style.display="none";renderRecipients()})});
attachment.addEventListener("change",e=>{attachmentFile=e.target.files[0]||null});
async function uploadAttachment(record){if(!attachmentFile)return null;try{return await api.uploadToR2(attachmentFile,{module:"MESAJ_MERKEZI",related_id:record,uploaded_by:userNameOf(currentUser())})}catch(e){api.showToast("R2 ek yükleme başarısız");return null}}
async function activity(action,message){const payload={action,module:"mailbox",related_module:"mailbox",related_record_id:message?.id||"",related_id:message?.id||"",description:message?.subject||"",user_id:currentUser().id||"",user_name:userNameOf(currentUser()),created_at:new Date().toISOString()};api.post("/activity-feed",payload).catch(()=>{});api.post("/audit-logs",payload).catch(()=>{})}
async function notifyRecipients(message){const payload={type:"message",title:"Yeni mesaj",message:message.subject||"Yeni mesaj",recipients:message.recipients,related_module:"mailbox",related_record_id:message.id,is_read:false,created_by:userNameOf(currentUser()),created_at:new Date().toISOString()};api.post("/notifications",payload).catch(()=>{})}
function recipientPayload(){return recipients.map(api.normalizeUser).map(u=>({user_id:u.id,fullname:u.fullname||u.username||"Kullanıcı",username:u.username,email:u.email,role:u.role,department:u.department}))}
async function buildPayload(status){const id="MSG-"+Date.now();const file=await uploadAttachment(id);const attachments=file?[normalizeAttachment(file)]:[];return{id,subject:subject.value.trim(),body:body.value.trim(),recipients:recipientPayload(),attachments,related_module:relatedModule.value||"General",related_record_id:relatedRecordId.value.trim(),status,folder:status,priority:priority.value||"normal",sender_id:currentUser().id||"",from:userNameOf(currentUser()),is_read:false,created_at:new Date().toISOString(),updated_at:new Date().toISOString()}}
async function save(status){const payload=await buildPayload(status);try{await api.post("/messages",payload)}catch(e){}messages.unshift(normalizeMessage(payload));if(status!=="draft")await notifyRecipients(payload);await activity(status==="draft"?"Taslak kaydedildi":"Mesaj gönderildi",payload);if(payload.attachments.length)await activity("Dosya eki eklendi",payload);clearCompose();selectedMessageId=payload.id;render();api.showToast(status==="draft"?"Taslak kaydedildi":"Mesaj gönderildi")}
function sendMessage(){if(!recipients.length)return api.showToast("Alıcı seç");save("sent")}
function saveDraft(){save("draft")}
function clearCompose(){recipients=[];subject.value="";body.value="";relatedModule.value="General";relatedRecordId.value="";priority.value="normal";attachment.value="";attachmentFile=null;renderRecipients()}
function replyTo(id){const m=messages.find(x=>x.id===id);if(!m)return;const sender=api.normalizeUser(m.sender||{id:m.sender_id,fullname:m.from,username:m.from_username,email:m.from_email,department:m.from_department});recipients=(sender.id||sender.fullname||sender.username)?[sender]:[];subject.value=/^Yanıt:/i.test(m.subject) ? m.subject : "Yanıt: "+(m.subject||"");body.value="\n\n--- Önceki Mesaj ---\n"+(m.body||"");relatedModule.value=m.related_module||"General";relatedRecordId.value=m.related_record_id||"";priority.value=m.priority||"normal";renderRecipients();api.showToast("Yanıt hazırlanıyor")}
async function markRead(id,silent=false){const m=messages.find(x=>x.id===id);if(m){m.is_read=true;api.put("/messages/"+encodeURIComponent(id)+"/read",{is_read:true,read_at:new Date().toISOString()}).catch(()=>{});await activity("Mesaj okundu",m);if(!silent)render()}}
async function moveTrash(id){const m=messages.find(x=>x.id===id);if(m){m.previous_folder=m.folder==="trash"?"inbox":m.folder;m.folder="trash";m.status="trash";api.put("/messages/"+encodeURIComponent(id)+"/trash",{status:"trash",deleted_at:new Date().toISOString()}).catch(()=>{});await activity("Mesaj çöpe taşındı",m);render()}}
async function restoreMessage(id){const m=messages.find(x=>x.id===id);if(m){m.folder=m.previous_folder||"inbox";m.status=m.folder;api.put("/messages/"+encodeURIComponent(id)+"/restore",{status:m.status,deleted_at:null}).catch(()=>{});await activity("Mesaj geri yüklendi",m);render()}}
document.querySelectorAll(".folder").forEach(btn=>btn.onclick=()=>{document.querySelectorAll(".folder").forEach(b=>b.classList.remove("active"));btn.classList.add("active");folder=btn.dataset.folder;render()});
searchBox.addEventListener("input",render);load();
</script>
<script src="assets/js/ui/enterprise-tools.js"></script>
</body>
</html>
